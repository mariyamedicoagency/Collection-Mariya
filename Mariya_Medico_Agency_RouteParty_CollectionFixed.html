<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769aa"><title>Mariya Medico Agency</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f6f8;color:#17202a}header{background:#1769aa;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}header b{font-size:19px}header small{opacity:.9}.nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.nav button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;padding:8px 11px;border-radius:9px;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.box{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}.big{font-size:25px;font-weight:750;margin-top:5px}.muted{color:#667085}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:9px;background:#fff}button{padding:11px 14px;border:0;border-radius:9px;background:#1769aa;color:#fff;cursor:pointer}.secondary{background:#eef4f8;color:#1769aa}.danger{background:#b42318}.success{background:#087443}.msg{padding:11px;border-radius:9px;background:#fff4cc;margin-bottom:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4f8;font-size:12px}.login{max-width:430px;margin:55px auto}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#1769aa;color:white}.tabs button:not(.active){background:#eef4f8;color:#1769aa}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:25px;text-align:center;color:#667085}@media(max-width:600px){th,td{white-space:nowrap}.tablewrap{margin:0 -5px}}
</style></head><body>
<div id="loginView" class="wrap"><div class="card login"><h1>Mariya Medico Agency</h1><p class="muted">Collection & Ledger</p><div id="loginMsg"></div><input id="email" type="email" placeholder="Email" autocomplete="username"><br><br><input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br><button style="width:100%" onclick="login()">Login</button></div></div>
<div id="appView" class="hidden"><header><b>Mariya Medico Agency</b><br><small id="userLabel"></small><div class="nav"><button onclick="showPage('dashboard')">Dashboard</button><button onclick="showPage('add')">+ Collection</button><button onclick="showPage('ledger')">Ledger</button><button onclick="showPage('reports')">Reports</button><button id="manageNav" class="hidden" onclick="showPage('manage')">Manage</button><button onclick="logout()">Logout</button></div></header><main class="wrap"><div id="msg"></div><section id="dashboard" class="page"></section><section id="add" class="page hidden"></section><section id="ledger" class="page hidden"></section><section id="reports" class="page hidden"></section><section id="manage" class="page hidden"></section></main></div>
<script>
const SUPABASE_URL='https://dwipacrbrmgszyaxgqqw.supabase.co';
const SUPABASE_KEY='sb_publishable_FAd6tW9a9WqIGJ0duNWZyw_DIbFlaDW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null, parties=[], routes=[], workers=[], routeParties=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function flash(t){document.getElementById('msg').innerHTML='<div class="msg">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',3500)}
function loginMsg(t){document.getElementById('loginMsg').innerHTML='<div class="msg">'+esc(t)+'</div>'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginMsg('Email and password required.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMsg(error.message);await start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return}me=user;let {data:p,error}=await sb.rpc('get_my_profile');if(error||!p){console.error('get_my_profile failed',error);await sb.auth.signOut();return loginMsg(error?.message||'Profile not found. Ask admin to create the profile for this user.')}profile=p;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userLabel').textContent=`${p.name} • ${p.role}`;document.getElementById('manageNav').classList.toggle('hidden',p.role!=='admin');await loadBase();showPage('dashboard')}
async function loadBase(){let a=await sb.from('parties').select('*').order('name');parties=a.data||[];let r=await sb.from('routes').select('*').eq('active',true).order('name');routes=r.data||[];let rp=await sb.from('route_parties').select('route_id,party_id');routeParties=rp.data||[];if(profile.role==='admin'){let w=await sb.from('profiles').select('*').eq('role','worker').eq('active',true).order('name');workers=w.data||[]}}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='dashboard')dashboard();if(id==='add')addPage();if(id==='ledger')ledgerPage();if(id==='reports')reportsPage();if(id==='manage')managePage()}
async function payments(filters={}){let q=sb.from('payments').select('id,amount,pay_date,remark,party_id,route_id,worker_id,created_at, parties(name), routes(name), profiles(name)');if(filters.start)q=q.gte('pay_date',filters.start);if(filters.end)q=q.lte('pay_date',filters.end);if(filters.date)q=q.eq('pay_date',filters.date);if(filters.route)q=q.eq('route_id',filters.route);if(filters.worker)q=q.eq('worker_id',filters.worker);if(filters.party)q=q.eq('party_id',filters.party);q=q.order('pay_date',{ascending:false}).order('id',{ascending:false});let {data,error}=await q;return {data:data||[],error}}
async function dashboard(){const d=today();let {data,error}=await payments({date:d});if(error)return flash(error.message);let total=data.reduce((a,x)=>a+Number(x.amount),0),byRoute={};routes.forEach(r=>byRoute[r.id]=0);data.forEach(x=>byRoute[x.route_id]=(byRoute[x.route_id]||0)+Number(x.amount));document.getElementById('dashboard').innerHTML=`<h2>Dashboard</h2><p class="muted">${d}</p><div class="grid"><div class="card">Today's Collection<div class="big">${money(total)}</div></div><div class="card">Payments<div class="big">${data.length}</div></div></div><h3>Route-wise Today</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(byRoute[r.id])}</div></div>`).join('')}</div><div class="box"><button onclick="showPage('add')">+ Add Collection</button> <button class="secondary" onclick="showPage('ledger')">Open Ledger</button></div>`}
function addPage(){document.getElementById('add').innerHTML=`<div class="box"><h2>Add Collection</h2><p class="muted">Pehle Route select karo. Us route ki assigned parties neeche aa jayengi. Har party ke saamne sirf payment amount bharna hai.</p><div class="row"><div><label>Date</label><input id="collectDate" type="date" value="${today()}" required></div><div><label>Route</label><select id="collectRoute" onchange="loadCollectionParties()" required><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>${profile.role==='admin'?`<div><label>Collected by</label><select id="collectWorker"><option value="${me.id}">${esc(profile.name)} (Admin)</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>`:''}</div></div><div id="collectionParties" class="box"><div class="empty">Pehle Route select karo.</div></div><div id="collectionSaveBox" class="box hidden"><div class="section-title"><div><span class="muted">Total Payment</span><div id="collectionTotal" class="big">₹0.00</div></div><button onclick="saveRouteCollection()">Save Collection</button></div></div>`}

function loadCollectionParties(){const rid=document.getElementById('collectRoute').value,box=document.getElementById('collectionParties'),save=document.getElementById('collectionSaveBox');if(!rid){box.innerHTML='<div class="empty">Pehle Route select karo.</div>';save.classList.add('hidden');return}const assigned=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>Number(x.party_id));const ps=parties.filter(p=>assigned.includes(Number(p.id)));if(!ps.length){box.innerHTML='<div class="msg">Is route par koi party assigned nahi hai.</div>';save.classList.add('hidden');return}box.innerHTML=`<div class="section-title"><h3>Parties</h3><span class="pill">${ps.length} parties</span></div><div id="collectionRows">${ps.map(p=>`<div class="collection-row" data-party="${p.id}" style="display:grid;grid-template-columns:minmax(0,1fr) 150px 82px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f2"><div><b>${esc(p.name)}</b>${p.phone?`<div class="muted" style="font-size:13px">${esc(p.phone)}</div>`:''}</div><input class="collectionAmount" data-party="${p.id}" type="number" min="0" step="0.01" placeholder="Payment ₹" oninput="updateCollectionTotal()"><button type="button" class="secondary" onclick="removeCollectionParty(${p.id})">Remove</button></div>`).join('')}</div><p class="muted" style="margin-bottom:0">Jis party ne is din/week payment nahi diya, uske saamne <b>Remove</b> dabao. Isse party route se permanently remove nahi hogi.</p>`;save.classList.remove('hidden');updateCollectionTotal()}
function removeCollectionParty(pid){const row=document.querySelector('.collection-row[data-party="'+pid+'"]');if(!row)return;row.remove();updateCollectionTotal();const rows=document.querySelectorAll('.collection-row');if(!rows.length){document.getElementById('collectionParties').innerHTML='<div class="msg">Is collection ke liye koi party nahi bachi. Route select karke dobara list la sakte ho.</div>';document.getElementById('collectionSaveBox').classList.add('hidden')}}
function updateCollectionTotal(){let total=0;document.querySelectorAll('.collectionAmount').forEach(i=>total+=Number(i.value||0));const el=document.getElementById('collectionTotal');if(el)el.textContent=money(total)}
async function saveRouteCollection(){const route=document.getElementById('collectRoute')?.value,date=document.getElementById('collectDate')?.value;if(!route||!date)return flash('Date aur Route select karo.');const worker=profile.role==='admin'?document.getElementById('collectWorker').value:me.id;const rows=[];document.querySelectorAll('.collectionAmount').forEach(i=>{const amount=Number(i.value||0);if(amount>0)rows.push({party_id:Number(i.dataset.party),amount,pay_date:date,route_id:Number(route),worker_id:worker})});if(!rows.length)return flash('Kam se kam ek party ka payment amount dalo.');const {error}=await sb.from('payments').insert(rows);if(error)return flash(error.message);flash('Collection saved successfully.');addPage();dashboard()}
async function ledgerPage(){document.getElementById('ledger').innerHTML=`<div class="box"><h2>Party Ledger</h2><div class="row"><div><label>Party</label><select id="lparty"><option value="">All parties</option>${parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Date</label><input id="ldate" type="date"></div><div><label>Route</label><select id="lroute"><option value="">All routes</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Worker</label><select id="lworker"><option value="">All workers</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><br><button onclick="runLedger()">Search</button></div><div id="ledgerResults" class="box"><div class="empty">Choose filters and tap Search.</div></div>`}
async function runLedger(){let f={date:document.getElementById('ldate').value,party:document.getElementById('lparty').value,route:document.getElementById('lroute').value,worker:document.getElementById('lworker').value};Object.keys(f).forEach(k=>{if(!f[k])delete f[k]});let {data,error}=await payments(f);if(error)return flash(error.message);let total=data.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('ledgerResults').innerHTML=`<div class="section-title"><h3>Results</h3><b>${money(total)}</b></div><div class="tablewrap"><table><tr><th>Date</th><th>Party</th><th>Amount</th><th>Route</th><th>Collected by</th><th>Remark</th></tr>${data.map(x=>`<tr><td>${esc(x.pay_date)}</td><td>${esc(x.parties?.name)}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name)}</td><td>${esc(x.profiles?.name)}</td><td>${esc(x.remark||'')}</td></tr>`).join('')}</table></div>`}
async function reportsPage(){document.getElementById('reports').innerHTML=`<div class="box"><h2>Reports</h2><div class="row"><div><label>From</label><input id="rstart" type="date" value="${today()}"></div><div><label>To</label><input id="rend" type="date" value="${today()}"></div></div><br><button onclick="runReports()">Generate Report</button></div><div id="reportResults"></div>`;runReports()}
async function runReports(){let start=document.getElementById('rstart').value,end=document.getElementById('rend').value;let {data,error}=await payments({start,end});if(error)return flash(error.message);let total=data.reduce((a,x)=>a+Number(x.amount),0),rt={},wt={};data.forEach(x=>{rt[x.route_id]=(rt[x.route_id]||0)+Number(x.amount);wt[x.worker_id]=(wt[x.worker_id]||0)+Number(x.amount)});document.getElementById('reportResults').innerHTML=`<div class="card"><span class="muted">Period total</span><div class="big">${money(total)}</div><p>${data.length} payments</p></div><h3>Route-wise</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(rt[r.id])}</div></div>`).join('')}</div><div class="box"><h3>Worker-wise</h3><div class="tablewrap"><table><tr><th>Worker</th><th>Total</th></tr>${(profile.role==='admin'?workers:[profile]).map(w=>`<tr><td>${esc(w.name)}</td><td>${money(wt[w.id])}</td></tr>`).join('')}</table></div></div>`}
function managePage(){document.getElementById('manage').innerHTML=`<div class="tabs"><button class="active" onclick="manageTab('partyTab',this)">Parties</button><button onclick="manageTab('routeTab',this)">Routes & Party Assignment</button></div><div id="partyTab"><div class="box"><h2>Add Party</h2><p class="muted">Party add karte waqt ek ya multiple routes select kar sakte ho. Ek party ko 2 ya zyada routes me add karna allowed hai.</p><div class="row"><input id="pname" placeholder="Party name"><input id="pphone" placeholder="Phone"><input id="paddress" placeholder="Address"><div><label>Routes</label><select id="proutes" multiple size="${Math.max(2,Math.min(6,routes.length||2))}">${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><small class="muted">Multiple routes ke liye Ctrl/long-press se select karein.</small></div><button onclick="addParty()">Add Party</button></div></div><div class="box"><h3>Parties</h3>${parties.map(p=>{const rs=routeParties.filter(x=>String(x.party_id)===String(p.id)).map(x=>routes.find(r=>String(r.id)===String(x.route_id))?.name).filter(Boolean);return `<p><b>${esc(p.name)}</b> <span class="pill">${esc(p.phone||'')}</span><br><span class="muted">${esc(p.address||'')}</span><br><span class="pill">Routes: ${esc(rs.join(', ')||'None')}</span></p>`}).join('')}</div></div><div id="routeTab" class="hidden"><div class="box"><h2>Add Route</h2><div class="row"><input id="rname" placeholder="Route name"><button onclick="addRoute()">Add Route</button></div></div><div class="box"><h3>Assign Parties to Route</h3><div class="row"><select id="assignRoute"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button onclick="assignAllParties()">Save Selected Parties</button></div><div id="assignList" class="empty">Route select karein.</div></div><div class="box"><h3>Routes</h3>${routes.map(r=>`<p><b>${esc(r.name)}</b> — ${routeParties.filter(x=>String(x.route_id)===String(r.id)).length} parties assigned</p>`).join('')}</div></div>`;const ar=document.getElementById('assignRoute');if(ar)ar.onchange=showAssignList}
function manageTab(id,btn){document.querySelectorAll('#manage>div[id$="Tab"]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='routeTab')showAssignList()}
function showAssignList(){const rid=document.getElementById('assignRoute')?.value,box=document.getElementById('assignList');if(!box)return;if(!rid){box.innerHTML='Route select karein.';return}const assigned=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>String(x.party_id));box.innerHTML=parties.map(p=>`<label style="display:block;padding:8px;border-bottom:1px solid #eee"><input class="assignParty" type="checkbox" value="${p.id}" ${assigned.includes(String(p.id))?'checked':''}> ${esc(p.name)}</label>`).join('')||'No parties'}
async function assignAllParties(){const rid=document.getElementById('assignRoute').value;if(!rid)return flash('Route select karein.');let d=await sb.from('route_parties').delete().eq('route_id',Number(rid));if(d.error)return flash(d.error.message);let ids=[...document.querySelectorAll('.assignParty:checked')].map(x=>Number(x.value));if(ids.length){let {error}=await sb.from('route_parties').insert(ids.map(pid=>({route_id:Number(rid),party_id:pid})));if(error)return flash(error.message)}await loadBase();flash('Route parties updated.');managePage();}
async function addParty(){let name=document.getElementById('pname').value.trim();if(!name)return flash('Party name dalo.');let {data,error}=await sb.from('parties').insert({name,phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim()}).select('id').single();if(error)return flash(error.message);const selected=[...document.getElementById('proutes').selectedOptions].map(o=>Number(o.value));if(selected.length){let {error:re}=await sb.from('route_parties').insert(selected.map(route_id=>({route_id,party_id:data.id})));if(re)return flash('Party add ho gayi, lekin route assignment nahi hua: '+re.message)}flash(selected.length?'Party added and route(s) assigned.':'Party added.');await loadBase();managePage()}
async function addRoute(){let name=document.getElementById('rname').value.trim();if(!name)return;let {error}=await sb.from('routes').insert({name});if(error)return flash(error.message);flash('Route added.');await loadBase();managePage()}
sb.auth.onAuthStateChange((_event)=>{if(_event==='SIGNED_OUT')location.reload()});start();
</script></body></html>
