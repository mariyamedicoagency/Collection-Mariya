<script>
const SUPABASE_URL='https://dwipacrbrmgszyaxgqqw.supabase.co';const SUPABASE_KEY='sb_publishable_FAd6tW9a9WqIGJ0duNWZyw_DIbFlaDW';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mariya-medico-auth'}});
let me=null,profile=null,parties=[],routes=[],workers=[],routeParties=[];let removedTodayParties=new Set();const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);
function flash(t,type=''){document.getElementById('msg').innerHTML='<div class="msg '+(type==='ok'?'ok':type==='err'?'err':'')+'">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',4500)}function loginMsg(t){document.getElementById('loginMsg').innerHTML='<div class="msg err">'+esc(t)+'</div>'}function isAdmin(){return profile?.role==='admin'}function isCoAdmin(){return String(profile?.role||'').toLowerCase()==='co_admin'||String(profile?.role||'').toLowerCase()==='co-admin'||String(profile?.name||'').trim().toLowerCase()==='shahzeb zelani'}function canSeeExpenses(){return isAdmin()||isCoAdmin()}function canEdit(){return isAdmin()}
function roleLabel(){return isAdmin()?'ADMIN':isCoAdmin()?'CO-ADMIN':'BOYS'}
let starting=false;let startingSession=false;
async function login(){if(starting)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginMsg('Email aur password dono dalo.');starting=true;loginMsg('Logging in...');try{const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMsg(error.message);await start()}catch(e){loginMsg('Login error: '+(e?.message||String(e)))}finally{starting=false}}
async function logout(){await sb.auth.signOut({scope:'local'});me=null;profile=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('password').value='';}
async function start(){if(startingSession)return;startingSession=true;try{const {data:{session}}=await sb.auth.getSession();const user=session?.user;if(!user){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return}me=user;const {data:p,error}=await sb.rpc('get_my_profile');if(error||!p){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return loginMsg(error?.message||'Profile not found. Admin se user profile/role save karwao.')}profile=p;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userLabel').textContent=(p.name||user.email)+' • '+String(p.role||'worker').replace('_','-');document.getElementById('roleBadge').textContent=roleLabel();document.getElementById('manageNav').classList.toggle('hidden',!isAdmin());document.querySelector('[data-page="expenses"]')?.classList.toggle('hidden',!canSeeExpenses());document.getElementById('companyNav')?.classList.toggle('hidden',!isAdmin());const ok=await loadBase();if(ok)showPage('dashboard')}finally{startingSession=false}}
async function loadBase(){try{let a=await sb.from('parties').select('*').order('name');if(a.error)throw a.error;parties=a.data||[];let r=await sb.from('routes').select('*').eq('active',true).order('name');if(r.error)throw r.error;routes=r.data||[];let rp=await sb.from('route_parties').select('route_id,party_id');if(rp.error)throw rp.error;routeParties=rp.data||[];if(profile.role==='admin'){let w=await sb.from('profiles').select('*').eq('role','worker').eq('active',true).order('name');if(w.error)throw w.error;workers=w.data||[]}else workers=[profile];return true}catch(e){flash('Database load error: '+e.message,'err');return false}}
function showPage(id){if(id==='expenses'&&!canSeeExpenses())return flash('Expenses sirf Admin aur Shahzeb Zelani (Co-Admin) ke liye hain.','err');if(id==='company'&&!isAdmin())return flash('Company Payment sirf Admin ke liye hai.','err');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='dashboard')dashboard();if(id==='add')addPage();if(id==='ledger')ledgerPage();if(id==='slips')dailySlipsPage();if(id==='reports')reportsPage();if(id==='expenses')expensesPage();if(id==='company')companyPage();if(id==='manage')managePage()}
async function payments(f={}){let q=sb.from('payments').select('id,amount,account_amount,pay_date,remark,party_id,route_id,worker_id,created_at,parties(name),routes(name),profiles(name)');if(f.start)q=q.gte('pay_date',f.start);if(f.end)q=q.lte('pay_date',f.end);if(f.date)q=q.eq('pay_date',f.date);if(f.route)q=q.eq('route_id',f.route);if(f.worker)q=q.eq('worker_id',f.worker);if(f.party)q=q.eq('party_id',f.party);q=q.order('pay_date',{ascending:false}).order('id',{ascending:false});return await q}
async function expenses(f={}){let q=sb.from('expenses').select('id,amount,expense_date,category,route_id,worker_id,remark,routes(name),profiles(name)');if(f.start)q=q.gte('expense_date',f.start);if(f.end)q=q.lte('expense_date',f.end);if(f.date)q=q.eq('expense_date',f.date);if(f.route)q=q.eq('route_id',f.route);if(f.worker)q=q.eq('worker_id',f.worker);q=q.order('expense_date',{ascending:false}).order('id',{ascending:false});return await q}
function sums(data){const total=data.reduce((a,x)=>a+Number(x.amount||0),0),account=data.reduce((a,x)=>a+Number(x.account_amount||0),0);return{total,account,cash:total-account}}
async function companyPayments(f={}){let q=sb.from('company_payments').select('id,amount,payment_date,mode,company,remark,created_by,profiles(name)');if(f.start)q=q.gte('payment_date',f.start);if(f.end)q=q.lte('payment_date',f.end);if(f.mode)q=q.eq('mode',f.mode);q=q.order('payment_date',{ascending:false}).order('id',{ascending:false});return await q}
function monthBounds(date){const [y,m]=date.split('-').map(Number);return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:`${y}-${String(m).padStart(2,'0')}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`}}

async function shareSlipPhoto(id, fileName='collection-slip'){
  const node=document.getElementById(id);
  if(!node)return flash('Slip nahi mili.','err');
  if(typeof html2canvas!=='function')return flash('Photo sharing library load nahi hui. Internet check karo.','err');
  const old=node.querySelector('.slip-actions');
  if(old)old.style.visibility='hidden';
  try{
    const canvas=await html2canvas(node,{backgroundColor:'#fffdf7',scale:2,useCORS:true,logging:false});
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('Photo create nahi hui.');
    const file=new File([blob],`${fileName}.png`,{type:'image/png'});
    if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
      await navigator.share({title:'Mariya Medico Agency - Collection Slip',text:'Collection Slip',files:[file]});
      return;
    }
    flash('Is browser me direct photo-share support nahi hai. Chrome/Android Share use karo.','err');
  }catch(e){
    if(e?.name!=='AbortError')flash('Slip share nahi hui: '+(e?.message||'Unknown error'),'err');
  }finally{if(old)old.style.visibility='visible';}
}

  ${canSeeExpenses()?`<br><div class="grid"><div class="card stat"><div class="label">Collection</div><div class="num">${money(s.total)}</div></div><div class="card stat"><div class="label">Expenses</div><div class="num">− ${money(expenseTotal)}</div></div><div class="card stat"><div class="label">Company Payments</div><div class="num">− ${money(companyTotal)}</div></div><div class="card stat"><div class="label">Cash After Money Out</div><div class="num">${money(netCash)}</div></div></div>`:''}`;
}
async function exportLedgerCSV(){const f={date:document.getElementById('ldate')?.value,start:document.getElementById('lstart')?.value,end:document.getElementById('lend')?.value,party:document.getElementById('lparty')?.value,route:document.getElementById('lroute')?.value,worker:document.getElementById('lworker')?.value};Object.keys(f).forEach(k=>{if(!f[k])delete f[k]});const r=await payments(f);if(r.error)return flash(r.error.message,'err');let d=r.data||[];const search=(document.getElementById('lsearch')?.value||'').toLowerCase();if(search)d=d.filter(x=>(x.parties?.name||'').toLowerCase().includes(search));const lines=[['Date','Party','Cash','Account','Total','Route','Collected By','Remark'],...d.map(x=>{const ac=Number(x.account_amount||0),t=Number(x.amount||0);return [x.pay_date,x.parties?.name||'',t-ac,ac,t,x.routes?.name||'',x.profiles?.name||'',x.remark||'']})];const csv=lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mariya-ledger-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);flash('Ledger CSV export ready.','ok')}


function printReport(){const sec=document.getElementById('reports');document.querySelectorAll('.page').forEach(x=>x.classList.remove('print-target'));sec.classList.add('print-target');window.print();setTimeout(()=>sec.classList.remove('print-target'),500)}

function expensesPage(){document.getElementById('expenses').innerHTML=`<div class="section-title"><div><h2>Expenses</h2><div class="muted">Daily Boys • Fooding Boys • Petrol • Transport • Other • ${isAdmin()?'Admin can edit/delete saved entries':'View only for Co-Admin'}</div></div></div><br><div class="box"><form onsubmit="saveExpense(event)"><div class="row"><div><label>Date</label><input id="edate" type="date" value="${today()}" required></div><div><label>Expense Type</label><select id="ecategory" required><option value="">Select type</option><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select></div><div><label>Amount</label><input id="eamount" type="number" min="0.01" step="0.01" required></div></div><br><div class="row"><div><label>Route</label><select id="eroute"><option value="">Common / No specific route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Expense added/paid by</label><select id="eworker">${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div><label>Remark</label><input id="eremark" placeholder="Optional"></div></div><br><button class="btn">Save Expense</button></form></div><div class="box"><div class="section-title"><h3>Expense History</h3><button class="btn secondary" onclick="loadExpenseHistory()">Refresh</button></div><div id="expenseHistory" class="empty">Loading...</div></div>`;loadExpenseHistory()}
async function saveExpense(e){e.preventDefault();const row={amount:Number(document.getElementById('eamount').value),expense_date:document.getElementById('edate').value,category:document.getElementById('ecategory').value,route_id:document.getElementById('eroute').value?Number(document.getElementById('eroute').value):null,worker_id:document.getElementById('eworker').value,remark:document.getElementById('eremark').value.trim()};const r=await sb.from('expenses').insert(row);if(r.error)return flash('Expense save nahi hua: '+r.error.message,'err');flash('Expense saved. Dashboard me final cash automatic minus hoga.','ok');e.target.reset();document.getElementById('edate').value=today();loadExpenseHistory();dashboard()}
async function loadExpenseHistory(){const r=await expenses({});if(r.error)return document.getElementById('expenseHistory').innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';const d=r.data||[],total=d.reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('expenseHistory').innerHTML=`<div class="grid"><div class="card stat"><div class="label">All Expenses</div><div class="num">${money(total)}</div></div><div class="card stat"><div class="label">Entries</div><div class="num">${d.length}</div></div></div>${d.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Route</th><th>Boys</th><th>Remark</th>${isAdmin()?'<th>Admin</th>':''}</tr>${d.map(x=>`<tr><td>${esc(x.expense_date)}</td><td><span class="badge expense">${esc(x.category)}</span></td><td><b>${money(x.amount)}</b></td><td>${esc(x.routes?.name||'Common')}</td><td>${esc(x.profiles?.name||'-')}</td><td>${esc(x.remark||'')}</td>${isAdmin()?`<td><button class="btn secondary" onclick="editExpense(${x.id})">Edit</button> <button class="btn danger" onclick="deleteExpense(${x.id})">Delete</button></td>`:''}</tr>`).join('')}</table></div>`:'<div class="empty">No expenses found.</div>'}`}
function companyPage(){if(!isAdmin())return;document.getElementById('company').innerHTML=`<div class="section-title"><div><h2>🏢 Company Payments</h2><div class="muted">Company ko payment alag se record karo. Cash se doge to cash balance minus hoga; Account se doge to account balance minus hoga.</div></div><span class="chip">ADMIN ONLY</span></div><br><div class="box"><form onsubmit="saveCompanyPayment(event)"><div class="row"><div><label>Date</label><input id="cpdate" type="date" value="${today()}" required></div><div><label>Company</label><input id="cpcompany" placeholder="Company name" required></div><div><label>Amount</label><input id="cpamount" type="number" min="0.01" step="0.01" required></div></div><br><div class="row"><div><label>Payment From</label><select id="cpmode"><option value="cash">Cash</option><option value="account">Account</option></select></div><div><label>Remark</label><input id="cpremark" placeholder="Invoice / company payment"></div><div style="align-self:end"><button class="btn green" style="width:100%">Save Company Payment</button></div></div></form></div><div class="box"><div class="section-title"><h3>Company Payment History</h3><button class="btn secondary" onclick="loadCompanyHistory()">Refresh</button></div><div id="companyHistory" class="empty">Loading...</div></div>`;loadCompanyHistory()}
async function saveCompanyPayment(e){e.preventDefault();if(!isAdmin())return flash('Sirf Admin company payment kar sakta hai.','err');const row={payment_date:document.getElementById('cpdate').value,company:document.getElementById('cpcompany').value.trim(),amount:Number(document.getElementById('cpamount').value),mode:document.getElementById('cpmode').value,remark:document.getElementById('cpremark').value.trim(),created_by:me.id};const r=await sb.from('company_payments').insert(row);if(r.error)return flash('Company payment save nahi hua: '+r.error.message,'err');flash('Company payment saved. Selected mode ka balance minus ho gaya.','ok');e.target.reset();document.getElementById('cpdate').value=today();loadCompanyHistory();dashboard()}
async function loadCompanyHistory(){const r=await companyPayments({});const el=document.getElementById('companyHistory');if(!el)return;if(r.error)return el.innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';const d=r.data||[],total=d.reduce((a,x)=>a+Number(x.amount||0),0),cash=d.filter(x=>x.mode==='cash').reduce((a,x)=>a+Number(x.amount||0),0),account=d.filter(x=>x.mode==='account').reduce((a,x)=>a+Number(x.amount||0),0);el.innerHTML=`<div class="grid"><div class="card stat"><div class="label">Total Company Payments</div><div class="num">${money(total)}</div></div><div class="card stat"><div class="label">Cash Paid</div><div class="num">${money(cash)}</div></div><div class="card stat"><div class="label">Account Paid</div><div class="num">${money(account)}</div></div></div>${d.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Company</th><th>Mode</th><th>Amount</th><th>Remark</th><th>Admin</th><th>Action</th></tr>${d.map(x=>`<tr><td>${esc(x.payment_date)}</td><td><b>${esc(x.company)}</b></td><td><span class="badge ${x.mode==='account'?'account':'cash'}">${esc(x.mode)}</span></td><td>${money(x.amount)}</td><td>${esc(x.remark||'-')}</td><td>${esc(x.profiles?.name||'-')}</td><td><button class="btn danger" onclick="deleteCompanyPayment(${x.id})">Delete</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No company payments yet.</div>'}`}

async function deleteCompanyPayment(id){if(!isAdmin())return flash('Sirf Admin delete kar sakta hai.','err');if(!confirm('Company payment permanently delete karna hai?'))return;const r=await sb.from('company_payments').delete().eq('id',id);if(r.error)return flash('Delete failed: '+r.error.message,'err');flash('Company payment deleted.','ok');loadCompanyHistory();dashboard()}

async function editPayment(id){if(!canEdit())return flash('Sirf Admin edit kar sakta hai.','err');const r=await sb.from('payments').select('*').eq('id',id).single();if(r.error)return flash(r.error.message,'err');const x=r.data;const party=prompt('Party ID:',x.party_id);if(party===null)return;const date=prompt('Date YYYY-MM-DD:',x.pay_date);if(date===null)return;const total=prompt('Total payment:',x.amount);if(total===null)return;const account=prompt('Account amount:',x.account_amount||0);if(account===null)return;const route=prompt('Route ID:',x.route_id);if(route===null)return;const worker=prompt('Boys/User UUID:',x.worker_id);if(worker===null)return;const remark=prompt('Remark:',x.remark||'');if(remark===null)return;const t=Number(total),a=Number(account);if(!Number.isFinite(t)||!Number.isFinite(a)||a<0||t<0||a>t)return flash('Invalid amount/account.','err');const u=await sb.from('payments').update({party_id:Number(party),pay_date:date,amount:t,account_amount:a,route_id:Number(route),worker_id:worker,remark}).eq('id',id);if(u.error)return flash('Payment update failed: '+u.error.message,'err');flash('Payment updated by Admin.','ok');runLedger()}
async function deletePayment(id){if(!canEdit())return flash('Sirf Admin delete kar sakta hai.','err');if(!confirm('Collection permanently delete karna hai?'))return;const r=await sb.from('payments').delete().eq('id',id);if(r.error)return flash('Delete failed: '+r.error.message,'err');flash('Collection deleted by Admin.','ok');runLedger()}
async function editExpense(id){if(!canEdit())return flash('Sirf Admin edit kar sakta hai.','err');const r=await sb.from('expenses').select('*').eq('id',id).single();if(r.error)return flash(r.error.message,'err');const x=r.data;const date=prompt('Date YYYY-MM-DD:',x.expense_date);if(date===null)return;const cat=prompt('Expense type:',x.category);if(cat===null)return;const amount=prompt('Amount:',x.amount);if(amount===null)return;const route=prompt('Route ID (blank = common):',x.route_id||'');if(route===null)return;const worker=prompt('Boys/User UUID:',x.worker_id);if(worker===null)return;const remark=prompt('Remark:',x.remark||'');if(remark===null)return;const u=await sb.from('expenses').update({expense_date:date,category:cat,amount:Number(amount),route_id:route?Number(route):null,worker_id:worker,remark}).eq('id',id);if(u.error)return flash('Expense update failed: '+u.error.message,'err');flash('Expense updated by Admin.','ok');loadExpenseHistory();dashboard()}
async function deleteExpense(id){if(!canEdit())return flash('Sirf Admin delete kar sakta hai.','err');if(!confirm('Expense permanently delete karna hai?'))return;const r=await sb.from('expenses').delete().eq('id',id);if(r.error)return flash('Delete failed: '+r.error.message,'err');flash('Expense deleted by Admin.','ok');loadExpenseHistory();dashboard()}
async function saveCoAdmin(){if(!isAdmin())return flash('Sirf Admin role set kar sakta hai.','err');const email=document.getElementById('coadminEmail')?.value.trim();if(!email)return flash('Shahzeb ka login email dalo.','err');const r=await sb.rpc('set_co_admin_by_email',{target_email:email,target_name:'Shahzeb Zelani'});if(r.error)return flash('Co-Admin save nahi hua: '+r.error.message,'err');flash('Shahzeb Zelani ko Co-Admin set kar diya gaya. Ab woh login karke Expenses dekh sakta hai.','ok');}
function managePage(){document.getElementById('manage').innerHTML=`<div class="box"><div class="section-title"><div><h2>Team & Roles</h2><div class="muted">Auth account pehle Supabase Authentication me bana hona chahiye. Yahan us account ko Co-Admin role milega.</div></div><span class="chip">Admin only</span></div><br><div class="row2"><div><label>Shahzeb Zelani — Login Email</label><input id="coadminEmail" type="email" placeholder="shahzeb@example.com"></div><button class="btn" style="align-self:end" onclick="saveCoAdmin()">Save as Co-Admin</button></div><div class="footnote" style="margin-top:10px">Isse password create nahi hota. Pehle Supabase → Authentication → Users me Shahzeb ka account create/invite karo; phir yahan uska same email save karo.</div></div>`+`<div class="tabs" style="display:flex;gap:8px;margin-bottom:14px"><button id="partyTabBtn" class="btn" onclick="manageTab('partyTab',this)">Parties</button><button id="routeTabBtn" class="btn secondary" onclick="manageTab('routeTab',this)">Routes & Assignment</button></div><div id="partyTab"><div class="box"><h2>Add Party</h2><div class="muted">Party add karte waqt ek ya multiple routes select kar sakte ho.</div><br><div class="row"><div><label>Party Name</label><input id="pname" placeholder="Roshan Medico"></div><div><label>Phone</label><input id="pphone" placeholder="Optional"></div><div><label>Address</label><input id="paddress" placeholder="Optional"></div></div><br><label>Route(s)</label><select id="proutes" multiple size="${Math.max(2,Math.min(6,routes.length||2))}">${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><small class="muted">Android par multiple route select karne ke liye ek option ko press-hold karke select karo.</small><br><br><button class="btn" onclick="addParty()">＋ Add Party</button></div><div class="box"><div class="section-title"><h3>All Parties</h3><span class="chip">${parties.length} parties</span></div>${parties.length?`<div class="tablewrap"><table><tr><th>Party</th><th>Phone</th><th>Routes</th></tr>${parties.map(p=>{const rs=routeParties.filter(x=>String(x.party_id)===String(p.id)).map(x=>routes.find(r=>String(r.id)===String(x.route_id))?.name).filter(Boolean);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.phone||'-')}</td><td>${rs.map(x=>`<span class="chip">${esc(x)}</span> `).join('')||'-'}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No parties yet.</div>'}</div></div><div id="routeTab" class="hidden"><div class="box"><h2>Add Route</h2><div class="row2"><input id="rname" placeholder="Chowk Daily Collection"><button class="btn" onclick="addRoute()">＋ Add Route</button></div></div><div class="box"><h3>Assign Parties to Route</h3><div class="row2"><select id="assignRoute"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn" onclick="assignAllParties()">Save Assignment</button></div><div id="assignList" class="empty">Route select karo.</div></div><div class="box"><h3>Routes</h3>${routes.map(r=>`<div class="route-card" style="margin-bottom:8px"><b>${esc(r.name)}</b><div class="muted">${routeParties.filter(x=>String(x.route_id)===String(r.id)).length} parties assigned</div></div>`).join('')||'<div class="empty">No routes yet.</div>'}</div></div>`}
function manageTab(id,btn){document.querySelectorAll('#manage>div[id$="Tab"]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('#manage .tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='routeTab')showAssignList()}
function showAssignList(){const rid=document.getElementById('assignRoute')?.value,box=document.getElementById('assignList');if(!box)return;if(!rid){box.innerHTML='<div class="empty">Route select karo.</div>';return}const assigned=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>String(x.party_id));box.innerHTML=parties.map(p=>`<label style="display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid var(--line);margin:0"><input class="assignParty" type="checkbox" value="${p.id}" ${assigned.includes(String(p.id))?'checked':''} style="width:auto"> <span><b>${esc(p.name)}</b><small class="muted" style="display:block">${esc(p.phone||'')}</small></span></label>`).join('')||'<div class="empty">No parties.</div>'}
async function assignAllParties(){const rid=document.getElementById('assignRoute').value;if(!rid)return flash('Route select karo.','err');let d=await sb.from('route_parties').delete().eq('route_id',Number(rid));if(d.error)return flash(d.error.message,'err');const ids=[...document.querySelectorAll('.assignParty:checked')].map(x=>Number(x.value));if(ids.length){const r=await sb.from('route_parties').insert(ids.map(party_id=>({route_id:Number(rid),party_id})));if(r.error)return flash(r.error.message,'err')}await loadBase();flash('Route assignment saved.','ok');managePage()}
async function addParty(){const name=document.getElementById('pname').value.trim();if(!name)return flash('Party name dalo.','err');const r=await sb.from('parties').insert({name,phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim()}).select('id').single();if(r.error)return flash(r.error.message,'err');const selected=[...document.getElementById('proutes').selectedOptions].map(o=>Number(o.value));if(selected.length){const a=await sb.from('route_parties').insert(selected.map(route_id=>({route_id,party_id:r.data.id})));if(a.error)return flash('Party add ho gayi, route assignment fail: '+a.error.message,'err')}await loadBase();flash('Party added'+(selected.length?' + route(s) assigned.':'.'),'ok');managePage()}
async function addRoute(){const name=document.getElementById('rname').value.trim();if(!name)return flash('Route name dalo.','err');const r=await sb.from('routes').insert({name});if(r.error)return flash(r.error.message,'err');await loadBase();flash('Route added.','ok');managePage()}
document.addEventListener('change',e=>{if(e.target.id==='assignRoute')showAssignList()});sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){me=null;profile=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');}else if(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'){start()}});start();
</script></body></html>
