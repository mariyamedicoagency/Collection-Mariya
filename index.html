<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1769aa"><title>Mariya Medico Agency</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f6f8;color:#17202a}header{background:#1769aa;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}header b{font-size:19px}header small{opacity:.9}.nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.nav button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;padding:8px 11px;border-radius:9px;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.box{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}.big{font-size:25px;font-weight:750;margin-top:5px}.muted{color:#667085}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:9px;background:#fff}button{padding:11px 14px;border:0;border-radius:9px;background:#1769aa;color:#fff;cursor:pointer}.secondary{background:#eef4f8;color:#1769aa}.danger{background:#b42318}.success{background:#087443}.msg{padding:11px;border-radius:9px;background:#fff4cc;margin-bottom:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4f8;font-size:12px}.login{max-width:430px;margin:55px auto}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#1769aa;color:white}.tabs button:not(.active){background:#eef4f8;color:#1769aa}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:25px;text-align:center;color:#667085}@media(max-width:600px){th,td{white-space:nowrap}.tablewrap{margin:0 -5px}}
</style></head><body>
<div id="loginView" class="wrap"><div class="card login"><h1>Mariya Medico Agency</h1><p class="muted">Collection & Ledger</p><div id="loginMsg"></div><input id="email" type="email" placeholder="Email" autocomplete="username"><br><br><input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br><button style="width:100%" onclick="login()">Login</button></div></div>
<div id="appView" class="hidden"><header><b>Mariya Medico Agency</b><br><small id="userLabel"></small><div class="nav"><button onclick="showPage('dashboard')">Dashboard</button><button onclick="showPage('add')">+ Collection</button><button onclick="showPage('ledger')">Ledger</button><button onclick="showPage('reports')">Reports</button><button onclick="showPage('expenses')">Expenses</button><button id="manageNav" class="hidden" onclick="showPage('manage')">Manage</button><button onclick="logout()">Logout</button></div></header><main class="wrap"><div id="msg"></div><section id="dashboard" class="page"></section><section id="add" class="page hidden"></section><section id="ledger" class="page hidden"></section><section id="reports" class="page hidden"></section><section id="expenses" class="page hidden"></section><section id="manage" class="page hidden"></section></main></div>
<script>
const SUPABASE_URL='https://dwipacrbrmgszyaxgqqw.supabase.co';
const SUPABASE_KEY='sb_publishable_FAd6tW9a9WqIGJ0duNWZyw_DIbFlaDW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null, profile=null, parties=[], routes=[], workers=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function flash(t){document.getElementById('msg').innerHTML='<div class="msg">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',3500)}
function loginMsg(t){document.getElementById('loginMsg').innerHTML='<div class="msg">'+esc(t)+'</div>'}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginMsg('Email and password required.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMsg(error.message);await start()}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(){const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return}me=user;let {data:p,error}=await sb.rpc('get_my_profile');if(error||!p){console.error('get_my_profile failed',error);await sb.auth.signOut();return loginMsg(error?.message||'Profile not found. Ask admin to create the profile for this user.')}profile=p;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userLabel').textContent=`${p.name} • ${p.role}`;document.getElementById('manageNav').classList.toggle('hidden',p.role!=='admin');await loadBase();showPage('dashboard')}
async function loadBase(){let a=await sb.from('parties').select('*').order('name');parties=a.data||[];let r=await sb.from('routes').select('*').eq('active',true).order('name');routes=r.data||[];if(profile.role==='admin'){let w=await sb.from('profiles').select('*').eq('role','worker').eq('active',true).order('name');workers=w.data||[]}}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='dashboard')dashboard();if(id==='add')addPage();if(id==='ledger')ledgerPage();if(id==='reports')reportsPage();if(id==='expenses')expensesPage();if(id==='manage')managePage()}
async function payments(filters={}){let q=sb.from('payments').select('id,amount,pay_date,remark,party_id,route_id,worker_id,created_at, parties(name), routes(name), profiles(name)');if(filters.start)q=q.gte('pay_date',filters.start);if(filters.end)q=q.lte('pay_date',filters.end);if(filters.date)q=q.eq('pay_date',filters.date);if(filters.route)q=q.eq('route_id',filters.route);if(filters.worker)q=q.eq('worker_id',filters.worker);if(filters.party)q=q.eq('party_id',filters.party);q=q.order('pay_date',{ascending:false}).order('id',{ascending:false});let {data,error}=await q;return {data:data||[],error}}
async function dashboard(){const d=today();let {data,error}=await payments({date:d});if(error)return flash(error.message);let ex=await expenses({date:d});if(ex.error)return flash(ex.error.message);let total=data.reduce((a,x)=>a+Number(x.amount),0),expenseTotal=ex.data.reduce((a,x)=>a+Number(x.amount),0),byRoute={};routes.forEach(r=>byRoute[r.id]=0);data.forEach(x=>byRoute[x.route_id]=(byRoute[x.route_id]||0)+Number(x.amount));document.getElementById('dashboard').innerHTML=`<h2>Dashboard</h2><p class="muted">${d}</p><div class="grid"><div class="card">Today's Collection<div class="big">${money(total)}</div></div><div class="card">Today's Expenses<div class="big">${money(expenseTotal)}</div></div><div class="card">Net Collection<div class="big">${money(total-expenseTotal)}</div></div><div class="card">Payments<div class="big">${data.length}</div></div></div><h3>Route-wise Collection Today</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(byRoute[r.id])}</div></div>`).join('')}</div><div class="box"><button onclick="showPage('add')">+ Add Collection</button> <button onclick="showPage('expenses')" class="secondary">+ Add Expense</button> <button class="secondary" onclick="showPage('ledger')">Open Ledger</button></div>`}
function addPage(){document.getElementById('add').innerHTML=`<div class="box"><h2>Add Collection</h2><form onsubmit="savePayment(event)"><label>Party</label><select id="party" required><option value="">Select party</option>${parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><br><br><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" required><br><br><label>Date</label><input id="paydate" type="date" value="${today()}" required><br><br><label>Route</label><select id="route" required>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>${profile.role==='admin'?`<br><br><label>Collected by</label><select id="worker"><option value="${me.id}">${esc(profile.name)} (Admin)</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select>`:''}<br><br><label>Remark</label><input id="remark" placeholder="Optional"><br><br><button>Save Collection</button></form></div>`}
async function savePayment(e){e.preventDefault();const worker=profile.role==='admin'?document.getElementById('worker').value:me.id;const {error}=await sb.from('payments').insert({party_id:Number(document.getElementById('party').value),amount:Number(document.getElementById('amount').value),pay_date:document.getElementById('paydate').value,route_id:Number(document.getElementById('route').value),worker_id:worker,remark:document.getElementById('remark').value.trim()});if(error)return flash(error.message);flash('Collection saved successfully.');e.target.reset();document.getElementById('paydate').value=today();dashboard()}
async function ledgerPage(){document.getElementById('ledger').innerHTML=`<div class="box"><h2>Party Ledger</h2><div class="row"><div><label>Party</label><select id="lparty"><option value="">All parties</option>${parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Date</label><input id="ldate" type="date"></div><div><label>Route</label><select id="lroute"><option value="">All routes</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Worker</label><select id="lworker"><option value="">All workers</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><br><button onclick="runLedger()">Search</button></div><div id="ledgerResults" class="box"><div class="empty">Choose filters and tap Search.</div></div>`}
async function runLedger(){let f={date:document.getElementById('ldate').value,party:document.getElementById('lparty').value,route:document.getElementById('lroute').value,worker:document.getElementById('lworker').value};Object.keys(f).forEach(k=>{if(!f[k])delete f[k]});let {data,error}=await payments(f);if(error)return flash(error.message);let total=data.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('ledgerResults').innerHTML=`<div class="section-title"><h3>Results</h3><b>${money(total)}</b></div><div class="tablewrap"><table><tr><th>Date</th><th>Party</th><th>Amount</th><th>Route</th><th>Collected by</th><th>Remark</th></tr>${data.map(x=>`<tr><td>${esc(x.pay_date)}</td><td>${esc(x.parties?.name)}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name)}</td><td>${esc(x.profiles?.name)}</td><td>${esc(x.remark||'')}</td></tr>`).join('')}</table></div>`}
async function reportsPage(){document.getElementById('reports').innerHTML=`<div class="box"><h2>Reports</h2><div class="row"><div><label>From</label><input id="rstart" type="date" value="${today()}"></div><div><label>To</label><input id="rend" type="date" value="${today()}"></div></div><br><button onclick="runReports()">Generate Report</button></div><div id="reportResults"></div>`;runReports()}
async function runReports(){let start=document.getElementById('rstart').value,end=document.getElementById('rend').value;let [{data,error},{data:ex,error:exError}]=await Promise.all([payments({start,end}),expenses({start,end})]);if(error)return flash(error.message);if(exError)return flash(exError.message);let total=data.reduce((a,x)=>a+Number(x.amount),0),expenseTotal=ex.reduce((a,x)=>a+Number(x.amount),0),rt={},et={},wt={};data.forEach(x=>{rt[x.route_id]=(rt[x.route_id]||0)+Number(x.amount);wt[x.worker_id]=(wt[x.worker_id]||0)+Number(x.amount)});ex.forEach(x=>{et[x.category]=(et[x.category]||0)+Number(x.amount)});document.getElementById('reportResults').innerHTML=`<div class="grid"><div class="card"><span class="muted">Total Collection</span><div class="big">${money(total)}</div><p>${data.length} payments</p></div><div class="card"><span class="muted">Total Expenses</span><div class="big">${money(expenseTotal)}</div><p>${ex.length} expenses</p></div><div class="card"><span class="muted">Net Amount</span><div class="big">${money(total-expenseTotal)}</div></div></div><h3>Route-wise Collection</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(rt[r.id])}</div></div>`).join('')}</div><div class="box"><h3>Expense-wise</h3><div class="tablewrap"><table><tr><th>Expense Type</th><th>Total</th></tr>${Object.keys(et).map(k=>`<tr><td>${esc(k)}</td><td>${money(et[k])}</td></tr>`).join('')}</table></div></div><div class="box"><h3>Worker-wise Collection</h3><div class="tablewrap"><table><tr><th>Worker</th><th>Total</th></tr>${(profile.role==='admin'?workers:[profile]).map(w=>`<tr><td>${esc(w.name)}</td><td>${money(wt[w.id])}</td></tr>`).join('')}</table></div></div>`}
function expensesPage(){document.getElementById('expenses').innerHTML=`<div class="box"><h2>Expenses</h2><form onsubmit="saveExpense(event)"><div class="row"><div><label>Date</label><input id="edate" type="date" value="${today()}" required></div><div><label>Expense Type</label><select id="ecategory" required><option value="">Select type</option><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select></div><div><label>Amount</label><input id="eamount" type="number" min="0.01" step="0.01" required></div><div><label>Route</label><select id="eroute"><option value="">Common / No specific route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div><br><div class="row"><div><label>Paid/Added by</label><select id="eworker"><option value="${me.id}">${esc(profile.name)} (${esc(profile.role)})</option>${profile.role==='admin'?workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join(''):''}</select></div><div><label>Remark</label><input id="eremark" placeholder="Optional"></div></div><br><button>Save Expense</button></form></div><div class="box"><div class="section-title"><h3>Expense History</h3><button class="secondary" onclick="loadExpenseHistory()">Refresh</button></div><div id="expenseHistory" class="empty">Loading...</div></div>`;loadExpenseHistory()}

async function saveExpense(e){e.preventDefault();const route=document.getElementById('eroute').value;const worker=document.getElementById('eworker').value;const row={amount:Number(document.getElementById('eamount').value),expense_date:document.getElementById('edate').value,category:document.getElementById('ecategory').value,route_id:route?Number(route):null,worker_id:worker,remark:document.getElementById('eremark').value.trim()};let {error}=await sb.from('expenses').insert(row);if(error)return flash(error.message);flash('Expense saved successfully.');e.target.reset();document.getElementById('edate').value=today();await loadExpenseHistory();dashboard()}

async function loadExpenseHistory(){let {data,error}=await expenses({});if(error)return document.getElementById('expenseHistory').innerHTML='<div class="msg">'+esc(error.message)+'</div>';let total=data.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('expenseHistory').innerHTML=`<p><b>Total: ${money(total)}</b></p><div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Route</th><th>Added by</th><th>Remark</th></tr>${data.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name||'Common')}</td><td>${esc(x.profiles?.name||'')}</td><td>${esc(x.remark||'')}</td></tr>`).join('')}</table></div>`}

function managePage(){document.getElementById('manage').innerHTML=`<div class="tabs"><button class="active" onclick="manageTab('partyTab',this)">Parties</button><button onclick="manageTab('routeTab',this)">Routes</button></div><div id="partyTab"><div class="box"><h2>Add Party</h2><div class="row"><input id="pname" placeholder="Party name"><input id="pphone" placeholder="Phone"><input id="paddress" placeholder="Address"><button onclick="addParty()">Add Party</button></div></div><div class="box"><h3>Parties</h3>${parties.map(p=>`<p><b>${esc(p.name)}</b> <span class="pill">${esc(p.phone||'')}</span><br><span class="muted">${esc(p.address||'')}</span></p>`).join('')}</div></div><div id="routeTab" class="hidden"><div class="box"><h2>Add Route</h2><div class="row"><input id="rname" placeholder="Route name"><button onclick="addRoute()">Add Route</button></div></div><div class="box"><h3>Routes</h3>${routes.map(r=>`<p>${esc(r.name)}</p>`).join('')}</div></div>`}
function manageTab(id,btn){document.querySelectorAll('#manage>div[id$="Tab"]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
async function addParty(){let name=document.getElementById('pname').value.trim();if(!name)return;let {error}=await sb.from('parties').insert({name,phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim()});if(error)return flash(error.message);flash('Party added.');await loadBase();managePage()}
async function addRoute(){let name=document.getElementById('rname').value.trim();if(!name)return;let {error}=await sb.from('routes').insert({name});if(error)return flash(error.message);flash('Route added.');await loadBase();managePage()}
sb.auth.onAuthStateChange((_event)=>{if(_event==='SIGNED_OUT')location.reload()});start();
</script></body></html>
