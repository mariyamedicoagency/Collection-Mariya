<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b74bb"><title>Mariya Medico Agency</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0878bd;--blue2:#075f99;--ink:#172033;--muted:#667085;--bg:#f4f7fb;--card:#fff;--line:#e5eaf0;--green:#087443;--red:#c4322d;--amber:#9a6700;--shadow:0 10px 30px rgba(20,40,70,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:18px}.login{max-width:440px;margin:70px auto}.card,.box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:15px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0878bd,#075f99);color:white;box-shadow:0 8px 24px #003b6626}.head{max-width:1180px;margin:auto;padding:15px 18px}.brand{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{font-size:21px;margin:0}.brand small{opacity:.85}.nav{display:flex;gap:8px;overflow:auto;padding-top:13px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;color:#fff;background:#ffffff18;border:1px solid #ffffff42;border-radius:12px;padding:10px 14px}.nav button.active,.nav button:hover{background:#fff;color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.stat{position:relative;overflow:hidden}.stat .label{color:var(--muted);font-size:13px}.stat .num{font-size:27px;font-weight:800;margin-top:7px}.stat .mini{font-size:12px;color:var(--muted);margin-top:5px}.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-35px;top:-35px;background:#0878bd12}
h2{margin:0 0 6px;font-size:25px}h3{margin:0 0 12px}.muted{color:var(--muted)}.msg{padding:12px 14px;border-radius:12px;background:#fff4cc;border:1px solid #f0d989;color:#694f00;margin-bottom:14px}.ok{background:#eaf8f0;border-color:#b7e3ca;color:#075b34}.err{background:#fff0ef;border-color:#f2b7b2;color:#8d211b}
label{display:block;font-size:13px;font-weight:650;color:#475467;margin-bottom:6px}input,select{width:100%;background:#fff;border:1px solid #cfd7e1;border-radius:11px;padding:12px;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0878bd14}.btn{padding:11px 15px;border-radius:11px;background:var(--blue);color:#fff}.btn:hover{background:var(--blue2)}.btn.secondary{background:#eef5fa;color:var(--blue)}.btn.danger{background:#fff0ef;color:var(--red);border:1px solid #f2c0bc}.btn.green{background:var(--green)}.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:320px}.totalbar{background:linear-gradient(135deg,#063f66,#0878bd);color:#fff;border:0}.totalbar .muted{color:#dceeff}.totalbar .num{font-size:30px;font-weight:850}.party-list{border:1px solid var(--line);border-radius:15px;overflow:hidden}.party-head,.party-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 115px 90px;gap:10px;align-items:center;padding:12px 13px}.party-head{background:#f7f9fc;color:#667085;font-size:12px;font-weight:750}.party-row{border-top:1px solid var(--line)}.party-row:hover{background:#fbfdff}.party-name{font-weight:750}.party-meta{font-size:12px;color:var(--muted);margin-top:3px}.amount-input{font-weight:700}.remove-btn{padding:9px 10px;border-radius:9px;background:#fff0ef;color:var(--red);font-size:12px}.account-input{background:#f7fbff}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:99px;background:#eef5fa;color:#17608e;font-size:12px;font-weight:650}.filter-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 1.2fr;gap:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}th{background:#f7f9fc;color:#667085;font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700}.cash{background:#eaf8f0;color:#087443}.account{background:#eef5ff;color:#1759a5}.expense{background:#fff1ed;color:#b93815}.empty{text-align:center;padding:30px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.route-card{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fff}.route-card .route-total{font-size:22px;font-weight:800;margin-top:7px}.route-card small{color:var(--muted)}.danger-text{color:var(--red)}
.login-hero{background:linear-gradient(135deg,#0878bd,#075f99);color:white;border-radius:20px;padding:22px;margin-bottom:15px}.login-hero h1{margin:0 0 5px}.login input{background:#fff}.footnote{font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:1fr 1fr}.party-head,.party-row{grid-template-columns:minmax(0,1fr) 130px 110px 75px}}
@media(max-width:600px){.wrap{padding:12px}.head{padding:13px 12px}.grid,.grid2,.row,.row2,.filter-grid{grid-template-columns:1fr}.brand h1{font-size:19px}.card,.box{padding:14px;border-radius:15px}.party-head{display:none}.party-row{grid-template-columns:1fr 1fr;gap:8px}.party-row .party-info{grid-column:1/-1}.party-row .remove-btn{width:100%}.party-row:has(.account-input){grid-template-columns:1fr 1fr}.toolbar input{max-width:none}h2{font-size:22px}table{min-width:850px}}
</style></head>
<body>
<div id="loginView" class="wrap"><div class="login card"><div class="login-hero"><h1>Mariya Medico Agency</h1><div>Collection • Ledger • Expenses</div></div><div id="loginMsg"></div><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Email"><br><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><br><button class="btn" style="width:100%" onclick="login()">Login</button></div></div>
<div id="appView" class="hidden"><header><div class="head"><div class="brand"><div><h1>Mariya Medico Agency</h1><small id="userLabel"></small></div><span class="chip" style="background:#ffffff20;color:#fff" id="roleBadge"></span></div><div class="nav"><button data-page="dashboard" onclick="showPage('dashboard')">Dashboard</button><button data-page="add" onclick="showPage('add')">＋ Collection</button><button data-page="ledger" onclick="showPage('ledger')">Ledger</button><button data-page="reports" onclick="showPage('reports')">Reports</button><button data-page="expenses" onclick="showPage('expenses')">Expenses</button><button id="manageNav" data-page="manage" class="hidden" onclick="showPage('manage')">Manage</button><button onclick="logout()">Logout</button></div></div></header><main class="wrap"><div id="msg"></div><section id="dashboard" class="page"></section><section id="add" class="page hidden"></section><section id="ledger" class="page hidden"></section><section id="reports" class="page hidden"></section><section id="expenses" class="page hidden"></section><section id="manage" class="page hidden"></section></main></div>
<script>
const SUPABASE_URL='https://dwipacrbrmgszyaxgqqw.supabase.co';const SUPABASE_KEY='sb_publishable_FAd6tW9a9WqIGJ0duNWZyw_DIbFlaDW';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mariya-medico-auth'}});
let me=null,profile=null,parties=[],routes=[],workers=[],routeParties=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);
function flash(t,type=''){document.getElementById('msg').innerHTML='<div class="msg '+(type==='ok'?'ok':type==='err'?'err':'')+'">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',4500)}function loginMsg(t){document.getElementById('loginMsg').innerHTML='<div class="msg err">'+esc(t)+'</div>'}function isAdmin(){return profile?.role==='admin'}function isCoAdmin(){return String(profile?.role||'').toLowerCase()==='co_admin'||String(profile?.role||'').toLowerCase()==='co-admin'||String(profile?.name||'').trim().toLowerCase()==='shahzeb zelani'}function canSeeExpenses(){return isAdmin()||isCoAdmin()}function canEdit(){return isAdmin()}
function roleLabel(){return isAdmin()?'ADMIN':isCoAdmin()?'CO-ADMIN':'WORKER'}
let starting=false;
async function login(){if(starting)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return loginMsg('Email aur password dono dalo.');starting=true;loginMsg('Logging in...');const {error}=await sb.auth.signInWithPassword({email,password});if(error){starting=false;return loginMsg(error.message)}await start();starting=false}
async function logout(){await sb.auth.signOut({scope:'local'});me=null;profile=null;document.getElementById('appView').classList.add('hidden');document.getElementById('loginView').classList.remove('hidden');document.getElementById('password').value='';}
async function start(){if(starting)return;const {data:{session}}=await sb.auth.getSession();const user=session?.user;if(!user){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return}me=user;const {data:p,error}=await sb.rpc('get_my_profile');if(error||!p){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return loginMsg(error?.message||'Profile not found. Admin se user profile/role save karwao.')}profile=p;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userLabel').textContent=p.name+' • '+p.role;document.getElementById('roleBadge').textContent=roleLabel();document.getElementById('manageNav').classList.toggle('hidden',!isAdmin());document.querySelector('[data-page="expenses"]')?.classList.toggle('hidden',!canSeeExpenses());const ok=await loadBase();if(ok)showPage('dashboard')}
async function loadBase(){try{let a=await sb.from('parties').select('*').order('name');if(a.error)throw a.error;parties=a.data||[];let r=await sb.from('routes').select('*').eq('active',true).order('name');if(r.error)throw r.error;routes=r.data||[];let rp=await sb.from('route_parties').select('route_id,party_id');if(rp.error)throw rp.error;routeParties=rp.data||[];if(profile.role==='admin'){let w=await sb.from('profiles').select('*').eq('role','worker').eq('active',true).order('name');if(w.error)throw w.error;workers=w.data||[]}else workers=[profile];return true}catch(e){flash('Database load error: '+e.message,'err');return false}}
function showPage(id){if(id==='expenses'&&!canSeeExpenses())return flash('Expenses sirf Admin aur Shahzeb Zelani (Co-Admin) ke liye hain.','err');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='dashboard')dashboard();if(id==='add')addPage();if(id==='ledger')ledgerPage();if(id==='reports')reportsPage();if(id==='expenses')expensesPage();if(id==='manage')managePage()}
async function payments(f={}){let q=sb.from('payments').select('id,amount,account_amount,pay_date,remark,party_id,route_id,worker_id,created_at,parties(name),routes(name),profiles(name)');if(f.start)q=q.gte('pay_date',f.start);if(f.end)q=q.lte('pay_date',f.end);if(f.date)q=q.eq('pay_date',f.date);if(f.route)q=q.eq('route_id',f.route);if(f.worker)q=q.eq('worker_id',f.worker);if(f.party)q=q.eq('party_id',f.party);q=q.order('pay_date',{ascending:false}).order('id',{ascending:false});return await q}
async function expenses(f={}){let q=sb.from('expenses').select('id,amount,expense_date,category,route_id,worker_id,remark,routes(name),profiles(name)');if(f.start)q=q.gte('expense_date',f.start);if(f.end)q=q.lte('expense_date',f.end);if(f.date)q=q.eq('expense_date',f.date);if(f.route)q=q.eq('route_id',f.route);if(f.worker)q=q.eq('worker_id',f.worker);q=q.order('expense_date',{ascending:false}).order('id',{ascending:false});return await q}
function sums(data){const total=data.reduce((a,x)=>a+Number(x.amount||0),0),account=data.reduce((a,x)=>a+Number(x.account_amount||0),0);return{total,account,cash:total-account}}
async function dashboard(){const d=today();const p=await payments({date:d});if(p.error)return flash(p.error.message,'err');const ex=canSeeExpenses()?await expenses({date:d}):{data:[],error:null};if(ex.error)return flash(ex.error.message,'err');const s=sums(p.data||[]),expenseTotal=(ex.data||[]).reduce((a,x)=>a+Number(x.amount||0),0),finalCash=s.cash-expenseTotal;const rt={};routes.forEach(r=>rt[r.id]=0);(p.data||[]).forEach(x=>rt[x.route_id]=(rt[x.route_id]||0)+Number(x.amount||0));document.getElementById('dashboard').innerHTML=`<div class="section-title"><div><h2>Dashboard</h2><div class="muted">Today • ${esc(d)}</div></div><div class="toolbar"><button class="btn" onclick="showPage('add')">＋ New Collection</button><button class="btn secondary" onclick="showPage('expenses')">＋ Expense</button></div></div><br><div class="grid"><div class="card stat"><div class="label">Total Collection</div><div class="num">${money(s.total)}</div><div class="mini">Cash + Account</div></div><div class="card stat"><div class="label">Cash Collection</div><div class="num">${money(s.cash)}</div><div class="mini">Physical cash</div></div><div class="card stat"><div class="label">Account Collection</div><div class="num">${money(s.account)}</div><div class="mini">Bank / account</div></div><div class="card stat"><div class="label">Final Cash</div><div class="num">${money(finalCash)}</div><div class="mini">Cash − Expenses</div></div></div><div class="grid2"><div class="box"><div class="section-title"><h3>Route-wise Today</h3><span class="chip">${p.data.length} entries</span></div>${routes.length?`<div class="grid2">${routes.map(r=>`<div class="route-card"><b>${esc(r.name)}</b><div class="route-total">${money(rt[r.id])}</div><small>Collection today</small></div>`).join('')}</div>`:'<div class="empty">No routes yet.</div>'}</div><div class="box"><div class="section-title"><h3>Today's Expenses</h3><b>${money(expenseTotal)}</b></div>${ex.data.length?`<div class="tablewrap"><table><tr><th>Type</th><th>Amount</th><th>Worker</th></tr>${ex.data.slice(0,8).map(x=>`<tr><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.profiles?.name||'-')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No expenses today.</div>'}</div></div><div class="box"><div class="section-title"><h3>Today's Collection</h3><button class="btn secondary" onclick="showPage('ledger')">Full Ledger</button></div>${p.data.length?`<div class="tablewrap"><table><tr><th>Party</th><th>Cash</th><th>Account</th><th>Total</th><th>Route</th><th>Collected by</th></tr>${p.data.slice(0,15).map(x=>{const ac=Number(x.account_amount||0),tot=Number(x.amount||0);return `<tr><td><b>${esc(x.parties?.name||'-')}</b></td><td>${money(tot-ac)}</td><td>${money(ac)}</td><td><b>${money(tot)}</b></td><td>${esc(x.routes?.name||'-')}</td><td>${esc(x.profiles?.name||'-')}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Aaj abhi collection nahi hai.</div>'}</div>`}
function addPage(){document.getElementById('add').innerHTML=`<div class="section-title"><div><h2>Route Collection</h2><div class="muted">Route select karo → parties automatically → Cash/Account bharo → final cash automatic.</div></div></div><br><div class="box"><div class="row"><div><label>Date</label><input id="bulkdate" type="date" value="${today()}"></div><div><label>Route</label><select id="bulkroute" onchange="renderBulkParties()"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>${profile.role==='admin'?`<div><label>Collected by</label><select id="bulkworker">${workers.map(w=>`<option value="${w.id}">${esc(w.name)}${w.id===me.id?' (Admin)':''}</option>`).join('')}</select></div>`:`<div><label>Collected by</label><input value="${esc(profile.name)}" disabled></div>`}</div></div><div id="bulkParties" class="box"><div class="empty">Pehle route select karo.</div></div><div class="box"><div class="section-title"><h3>Expenses — Collection se minus</h3><button class="btn secondary" type="button" onclick="addExpenseLine()">＋ Add Expense</button></div><div id="expenseLines"></div><div class="muted" style="margin-top:8px">Example: Daily Boys ₹50, Fooding Boys ₹50, Petrol ₹200. Jitne chaho expense add karo.</div></div><div class="card totalbar"><div class="grid"><div><div class="muted">Total Collection</div><div id="bulkTotal" class="num">₹0.00</div></div><div><div class="muted">Account</div><div id="bulkAccountTotal" class="num">₹0.00</div></div><div><div class="muted">Expenses</div><div id="bulkExpenseTotal" class="num">₹0.00</div></div><div><div class="muted">FINAL CASH</div><div id="bulkNet" class="num">₹0.00</div></div></div><br><button class="btn green" onclick="saveBulkCollection()">✓ Save Collection & Expenses</button></div>`}
function renderBulkParties(){const rid=document.getElementById('bulkroute').value,el=document.getElementById('bulkParties');if(!rid){el.innerHTML='<div class="empty">Pehle route select karo.</div>';return}const ids=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>String(x.party_id));const ps=parties.filter(p=>ids.includes(String(p.id)));if(!ps.length){el.innerHTML='<div class="empty">Is route me koi party assigned nahi hai. Manage me party ko route me add karo.</div>';return}el.innerHTML=`<div class="section-title"><div><h3>Parties — ${ps.length}</h3><div class="muted">Payment nahi mila ho to <b>Remove today</b> dabao. Party permanently delete nahi hogi.</div></div><span class="chip">Cash + Account</span></div><br><div class="party-list"><div class="party-head"><div>PARTY</div><div>CASH ₹</div><div>ACCOUNT ₹</div><div>ACTION</div></div>${ps.map(p=>`<div class="party-row" data-party="${p.id}"><div class="party-info"><div class="party-name">${esc(p.name)}</div><div class="party-meta">${esc(p.phone||'')}</div></div><input class="amount-input bulkAmount" data-party="${p.id}" type="number" min="0" step="0.01" placeholder="Cash ₹" oninput="updateBulkTotal()"><input class="amount-input account-input bulkAccount" data-party="${p.id}" type="number" min="0" step="0.01" placeholder="Account ₹" oninput="updateBulkTotal()"><button class="remove-btn" type="button" onclick="removeTodayParty(${p.id})">Remove</button></div>`).join('')}</div>`;updateBulkTotal()}
function removeTodayParty(pid){const row=document.querySelector('.party-row[data-party="'+pid+'"]');if(row){row.remove();updateBulkTotal();flash('Party is collection list se hata di gayi. Route assignment safe hai.','ok')}}
function addExpenseLine(){const box=document.getElementById('expenseLines'),id='ex'+Date.now();box.insertAdjacentHTML('beforeend',`<div class="row" id="${id}" style="margin-top:10px"><div><label>Type</label><select class="bulkExType"><option value="">Select type</option><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select></div><div><label>Amount</label><input class="bulkExAmount" type="number" min="0.01" step="0.01" value="0" oninput="updateBulkTotal()"></div><div><label>Remark / Action</label><div style="display:flex;gap:7px"><input class="bulkExRemark" placeholder="Optional"><button class="btn danger" type="button" onclick="document.getElementById('${id}').remove();updateBulkTotal()">Remove</button></div></div></div>`);updateBulkTotal()}
function updateBulkTotal(){let cash=0,account=0,ex=0;document.querySelectorAll('.bulkAmount').forEach(i=>cash+=Number(i.value||0));document.querySelectorAll('.bulkAccount').forEach(i=>account+=Number(i.value||0));document.querySelectorAll('.bulkExAmount').forEach(i=>ex+=Number(i.value||0));const t=cash+account;const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=money(v)};set('bulkTotal',t);set('bulkAccountTotal',account);set('bulkExpenseTotal',ex);set('bulkNet',cash-ex)}
async function saveBulkCollection(){const route=document.getElementById('bulkroute')?.value,date=document.getElementById('bulkdate')?.value;if(!route||!date)return flash('Date aur Route select karo.','err');const worker=profile.role==='admin'?document.getElementById('bulkworker').value:me.id;const rows=[];document.querySelectorAll('.bulkAmount').forEach(i=>{const ac=document.querySelector('.bulkAccount[data-party="'+i.dataset.party+'"]');const cash=Number(i.value||0),account=Number(ac?.value||0),total=cash+account;if(total>0)rows.push({party_id:Number(i.dataset.party),amount:total,account_amount:account,pay_date:date,route_id:Number(route),worker_id:worker})});if(!rows.length)return flash('Kam se kam ek party ka payment dalo.','err');const ins=await sb.from('payments').insert(rows);if(ins.error)return flash('Collection save nahi hua: '+ins.error.message,'err');const exRows=[];document.querySelectorAll('#expenseLines .row').forEach(r=>{const amt=Number(r.querySelector('.bulkExAmount')?.value||0),cat=r.querySelector('.bulkExType')?.value||'',remark=r.querySelector('.bulkExRemark')?.value?.trim()||'';if(amt>0)exRows.push({amount:amt,expense_date:date,category:cat,route_id:Number(route),worker_id:worker,remark})});if(exRows.some(x=>!x.category))return flash('Har expense ka type select karo. Collection save ho gayi; ab expense type complete karke Expenses page se add kar do.','err');if(exRows.length){const er=await sb.from('expenses').insert(exRows);if(er.error)return flash('Collection save ho gayi, expense save nahi hua: '+er.error.message,'err')}flash('Collection + Expenses saved. Final cash automatic calculate ho gaya.','ok');await loadBase();showPage('dashboard')}
async function ledgerPage(){document.getElementById('ledger').innerHTML=`<div class="section-title"><div><h2>Ledger</h2><div class="muted">Date, Party, Route aur Worker — sab alag filter. Search bhi available.</div></div><button class="btn secondary" onclick="showPage('reports')">Reports</button></div><br><div class="box"><div class="filter-grid"><div><label>Search Party</label><input id="lsearch" placeholder="Party name search..."></div><div><label>Date</label><input id="ldate" type="date"></div><div><label>Party</label><select id="lparty"><option value="">All parties</option>${parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div><label>Route</label><select id="lroute"><option value="">All routes</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Worker</label><select id="lworker"><option value="">All workers</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><br><div class="toolbar"><button class="btn" onclick="runLedger()">🔎 Search Ledger</button><button class="btn secondary" onclick="clearLedger()">Clear</button></div></div><div id="ledgerResults" class="box"><div class="empty">Filter select karke Search dabao.</div></div>`}
function clearLedger(){document.getElementById('lsearch').value='';document.getElementById('ldate').value='';document.getElementById('lparty').value='';document.getElementById('lroute').value='';document.getElementById('lworker').value='';runLedger()}
async function runLedger(){let f={date:document.getElementById('ldate').value,party:document.getElementById('lparty').value,route:document.getElementById('lroute').value,worker:document.getElementById('lworker').value};Object.keys(f).forEach(k=>{if(!f[k])delete f[k]});const r=await payments(f);if(r.error)return flash(r.error.message,'err');let data=r.data||[];const search=document.getElementById('lsearch').value.trim().toLowerCase();if(search)data=data.filter(x=>(x.parties?.name||'').toLowerCase().includes(search));const s=sums(data);document.getElementById('ledgerResults').innerHTML=`<div class="grid"><div class="card stat"><div class="label">Total</div><div class="num">${money(s.total)}</div></div><div class="card stat"><div class="label">Cash</div><div class="num">${money(s.cash)}</div></div><div class="card stat"><div class="label">Account</div><div class="num">${money(s.account)}</div></div><div class="card stat"><div class="label">Entries</div><div class="num">${data.length}</div></div></div><div class="section-title"><h3>Collection Entries</h3><span class="chip">${isAdmin()?'Admin: Edit/Delete enabled':'Worker: view only'}</span></div><br>${data.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Party</th><th>Cash</th><th>Account</th><th>Total</th><th>Route</th><th>Collected by</th><th>Remark</th>${isAdmin()?'<th>Admin</th>':''}</tr>${data.map(x=>{const ac=Number(x.account_amount||0),tot=Number(x.amount||0);return `<tr><td>${esc(x.pay_date)}</td><td><b>${esc(x.parties?.name||'-')}</b></td><td>${money(tot-ac)}</td><td>${money(ac)}</td><td><b>${money(tot)}</b></td><td>${esc(x.routes?.name||'-')}</td><td><span class="chip">${esc(x.profiles?.name||'-')}</span></td><td>${esc(x.remark||'')}</td>${isAdmin()?`<td><button class="btn secondary" onclick="editPayment(${x.id})">Edit</button> <button class="btn danger" onclick="deletePayment(${x.id})">Delete</button></td>`:''}</tr>`}).join('')}</table></div>`:'<div class="empty">No matching collection found.</div>'}`}
async function reportsPage(){document.getElementById('reports').innerHTML=`<div class="section-title"><div><h2>Reports</h2><div class="muted">Date range + route + worker performance.</div></div></div><br><div class="box"><div class="row2"><div><label>From</label><input id="rstart" type="date" value="${today()}"></div><div><label>To</label><input id="rend" type="date" value="${today()}"></div></div><br><button class="btn" onclick="runReports()">Generate Report</button></div><div id="reportResults"></div>`;runReports()}
async function runReports(){const start=document.getElementById('rstart').value,end=document.getElementById('rend').value;const [p,ex]=await Promise.all([payments({start,end}),canSeeExpenses()?expenses({start,end}):Promise.resolve({data:[],error:null})]);if(p.error)return flash(p.error.message,'err');if(ex.error)return flash(ex.error.message,'err');const s=sums(p.data||[]),et=(ex.data||[]).reduce((a,x)=>a+Number(x.amount||0),0),finalCash=s.cash-et,rt={},wt={};routes.forEach(r=>rt[r.id]=0);workers.forEach(w=>wt[w.id]=0);(p.data||[]).forEach(x=>{rt[x.route_id]=(rt[x.route_id]||0)+Number(x.amount||0);wt[x.worker_id]=(wt[x.worker_id]||0)+Number(x.amount||0)});document.getElementById('reportResults').innerHTML=`<div class="grid"><div class="card stat"><div class="label">Total Collection</div><div class="num">${money(s.total)}</div></div><div class="card stat"><div class="label">Cash</div><div class="num">${money(s.cash)}</div></div><div class="card stat"><div class="label">Account</div><div class="num">${money(s.account)}</div></div><div class="card stat"><div class="label">Final Cash</div><div class="num">${money(finalCash)}</div><div class="mini">Cash − expenses</div></div></div><div class="grid2"><div class="box"><h3>Route-wise</h3>${routes.map(r=>`<div class="route-card" style="margin-bottom:8px"><b>${esc(r.name)}</b><div class="route-total">${money(rt[r.id])}</div></div>`).join('')||'<div class="empty">No routes.</div>'}</div><div class="box"><h3>Worker-wise Collection</h3><div class="tablewrap"><table><tr><th>Worker</th><th>Collection</th></tr>${workers.map(w=>`<tr><td>${esc(w.name)}</td><td><b>${money(wt[w.id]||0)}</b></td></tr>`).join('')}</table></div></div></div><div class="box"><h3>Expense-wise</h3><div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Route</th><th>Worker</th></tr>${(ex.data||[]).map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name||'Common')}</td><td>${esc(x.profiles?.name||'-')}</td></tr>`).join('')||'<tr><td colspan="5">No expenses.</td></tr>'}</table></div></div>`}
function expensesPage(){document.getElementById('expenses').innerHTML=`<div class="section-title"><div><h2>Expenses</h2><div class="muted">Daily Boys • Fooding Boys • Petrol • Transport • Other • ${isAdmin()?'Admin can edit/delete saved entries':'View only for Co-Admin'}</div></div></div><br><div class="box"><form onsubmit="saveExpense(event)"><div class="row"><div><label>Date</label><input id="edate" type="date" value="${today()}" required></div><div><label>Expense Type</label><select id="ecategory" required><option value="">Select type</option><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select></div><div><label>Amount</label><input id="eamount" type="number" min="0.01" step="0.01" required></div></div><br><div class="row"><div><label>Route</label><select id="eroute"><option value="">Common / No specific route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div><label>Expense added/paid by</label><select id="eworker">${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div><label>Remark</label><input id="eremark" placeholder="Optional"></div></div><br><button class="btn">Save Expense</button></form></div><div class="box"><div class="section-title"><h3>Expense History</h3><button class="btn secondary" onclick="loadExpenseHistory()">Refresh</button></div><div id="expenseHistory" class="empty">Loading...</div></div>`;loadExpenseHistory()}
async function saveExpense(e){e.preventDefault();const row={amount:Number(document.getElementById('eamount').value),expense_date:document.getElementById('edate').value,category:document.getElementById('ecategory').value,route_id:document.getElementById('eroute').value?Number(document.getElementById('eroute').value):null,worker_id:document.getElementById('eworker').value,remark:document.getElementById('eremark').value.trim()};const r=await sb.from('expenses').insert(row);if(r.error)return flash('Expense save nahi hua: '+r.error.message,'err');flash('Expense saved. Dashboard me final cash automatic minus hoga.','ok');e.target.reset();document.getElementById('edate').value=today();loadExpenseHistory();dashboard()}
async function loadExpenseHistory(){const r=await expenses({});if(r.error)return document.getElementById('expenseHistory').innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';const d=r.data||[],total=d.reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('expenseHistory').innerHTML=`<div class="card stat"><div class="label">All Expenses</div><div class="num">${money(total)}</div></div>${d.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Route</th><th>Worker</th><th>Remark</th>${isAdmin()?'<th>Admin</th>':''}</tr>${d.map(x=>`<tr><td>${esc(x.expense_date)}</td><td><span class="badge expense">${esc(x.category)}</span></td><td><b>${money(x.amount)}</b></td><td>${esc(x.routes?.name||'Common')}</td><td>${esc(x.profiles?.name||'-')}</td><td>${esc(x.remark||'')}</td>${isAdmin()?`<td><button class="btn secondary" onclick="editExpense(${x.id})">Edit</button> <button class="btn danger" onclick="deleteExpense(${x.id})">Delete</button></td>`:''}</tr>`).join('')}</table></div>`:'<div class="empty">No expenses found.</div>'}`}
async function editPayment(id){if(!canEdit())return flash('Sirf Admin edit kar sakta hai.','err');const r=await sb.from('payments').select('*').eq('id',id).single();if(r.error)return flash(r.error.message,'err');const x=r.data;const party=prompt('Party ID:',x.party_id);if(party===null)return;const date=prompt('Date YYYY-MM-DD:',x.pay_date);if(date===null)return;const total=prompt('Total payment:',x.amount);if(total===null)return;const account=prompt('Account amount:',x.account_amount||0);if(account===null)return;const route=prompt('Route ID:',x.route_id);if(route===null)return;const worker=prompt('Worker/User UUID:',x.worker_id);if(worker===null)return;const remark=prompt('Remark:',x.remark||'');if(remark===null)return;const t=Number(total),a=Number(account);if(!Number.isFinite(t)||!Number.isFinite(a)||a<0||t<0||a>t)return flash('Invalid amount/account.','err');const u=await sb.from('payments').update({party_id:Number(party),pay_date:date,amount:t,account_amount:a,route_id:Number(route),worker_id:worker,remark}).eq('id',id);if(u.error)return flash('Payment update failed: '+u.error.message,'err');flash('Payment updated by Admin.','ok');runLedger()}
async function deletePayment(id){if(!canEdit())return flash('Sirf Admin delete kar sakta hai.','err');if(!confirm('Collection permanently delete karna hai?'))return;const r=await sb.from('payments').delete().eq('id',id);if(r.error)return flash('Delete failed: '+r.error.message,'err');flash('Collection deleted by Admin.','ok');runLedger()}
async function editExpense(id){if(!canEdit())return flash('Sirf Admin edit kar sakta hai.','err');const r=await sb.from('expenses').select('*').eq('id',id).single();if(r.error)return flash(r.error.message,'err');const x=r.data;const date=prompt('Date YYYY-MM-DD:',x.expense_date);if(date===null)return;const cat=prompt('Expense type:',x.category);if(cat===null)return;const amount=prompt('Amount:',x.amount);if(amount===null)return;const route=prompt('Route ID (blank = common):',x.route_id||'');if(route===null)return;const worker=prompt('Worker/User UUID:',x.worker_id);if(worker===null)return;const remark=prompt('Remark:',x.remark||'');if(remark===null)return;const u=await sb.from('expenses').update({expense_date:date,category:cat,amount:Number(amount),route_id:route?Number(route):null,worker_id:worker,remark}).eq('id',id);if(u.error)return flash('Expense update failed: '+u.error.message,'err');flash('Expense updated by Admin.','ok');loadExpenseHistory();dashboard()}
async function deleteExpense(id){if(!canEdit())return flash('Sirf Admin delete kar sakta hai.','err');if(!confirm('Expense permanently delete karna hai?'))return;const r=await sb.from('expenses').delete().eq('id',id);if(r.error)return flash('Delete failed: '+r.error.message,'err');flash('Expense deleted by Admin.','ok');loadExpenseHistory();dashboard()}
async function saveCoAdmin(){if(!isAdmin())return flash('Sirf Admin role set kar sakta hai.','err');const email=document.getElementById('coadminEmail')?.value.trim();if(!email)return flash('Shahzeb ka login email dalo.','err');const r=await sb.rpc('set_co_admin_by_email',{target_email:email,target_name:'Shahzeb Zelani'});if(r.error)return flash('Co-Admin save nahi hua: '+r.error.message,'err');flash('Shahzeb Zelani ko Co-Admin set kar diya gaya. Ab woh login karke Expenses dekh sakta hai.','ok');}
function managePage(){document.getElementById('manage').innerHTML=`<div class="box"><div class="section-title"><div><h2>Team & Roles</h2><div class="muted">Auth account pehle Supabase Authentication me bana hona chahiye. Yahan us account ko Co-Admin role milega.</div></div><span class="chip">Admin only</span></div><br><div class="row2"><div><label>Shahzeb Zelani — Login Email</label><input id="coadminEmail" type="email" placeholder="shahzeb@example.com"></div><button class="btn" style="align-self:end" onclick="saveCoAdmin()">Save as Co-Admin</button></div><div class="footnote" style="margin-top:10px">Isse password create nahi hota. Pehle Supabase → Authentication → Users me Shahzeb ka account create/invite karo; phir yahan uska same email save karo.</div></div>`+`<div class="tabs" style="display:flex;gap:8px;margin-bottom:14px"><button id="partyTabBtn" class="btn" onclick="manageTab('partyTab',this)">Parties</button><button id="routeTabBtn" class="btn secondary" onclick="manageTab('routeTab',this)">Routes & Assignment</button></div><div id="partyTab"><div class="box"><h2>Add Party</h2><div class="muted">Party add karte waqt ek ya multiple routes select kar sakte ho.</div><br><div class="row"><div><label>Party Name</label><input id="pname" placeholder="Roshan Medico"></div><div><label>Phone</label><input id="pphone" placeholder="Optional"></div><div><label>Address</label><input id="paddress" placeholder="Optional"></div></div><br><label>Route(s)</label><select id="proutes" multiple size="${Math.max(2,Math.min(6,routes.length||2))}">${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><small class="muted">Android par multiple route select karne ke liye ek option ko press-hold karke select karo.</small><br><br><button class="btn" onclick="addParty()">＋ Add Party</button></div><div class="box"><div class="section-title"><h3>All Parties</h3><span class="chip">${parties.length} parties</span></div>${parties.length?`<div class="tablewrap"><table><tr><th>Party</th><th>Phone</th><th>Routes</th></tr>${parties.map(p=>{const rs=routeParties.filter(x=>String(x.party_id)===String(p.id)).map(x=>routes.find(r=>String(r.id)===String(x.route_id))?.name).filter(Boolean);return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.phone||'-')}</td><td>${rs.map(x=>`<span class="chip">${esc(x)}</span> `).join('')||'-'}</td></tr>`}).join('')}</table></div>`:'<div class="empty">No parties yet.</div>'}</div></div><div id="routeTab" class="hidden"><div class="box"><h2>Add Route</h2><div class="row2"><input id="rname" placeholder="Chowk Daily Collection"><button class="btn" onclick="addRoute()">＋ Add Route</button></div></div><div class="box"><h3>Assign Parties to Route</h3><div class="row2"><select id="assignRoute"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button class="btn" onclick="assignAllParties()">Save Assignment</button></div><div id="assignList" class="empty">Route select karo.</div></div><div class="box"><h3>Routes</h3>${routes.map(r=>`<div class="route-card" style="margin-bottom:8px"><b>${esc(r.name)}</b><div class="muted">${routeParties.filter(x=>String(x.route_id)===String(r.id)).length} parties assigned</div></div>`).join('')||'<div class="empty">No routes yet.</div>'}</div></div>`}
function manageTab(id,btn){document.querySelectorAll('#manage>div[id$="Tab"]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('#manage .tabs button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='routeTab')showAssignList()}
function showAssignList(){const rid=document.getElementById('assignRoute')?.value,box=document.getElementById('assignList');if(!box)return;if(!rid){box.innerHTML='<div class="empty">Route select karo.</div>';return}const assigned=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>String(x.party_id));box.innerHTML=parties.map(p=>`<label style="display:flex;gap:10px;align-items:center;padding:11px;border-bottom:1px solid var(--line);margin:0"><input class="assignParty" type="checkbox" value="${p.id}" ${assigned.includes(String(p.id))?'checked':''} style="width:auto"> <span><b>${esc(p.name)}</b><small class="muted" style="display:block">${esc(p.phone||'')}</small></span></label>`).join('')||'<div class="empty">No parties.</div>'}
async function assignAllParties(){const rid=document.getElementById('assignRoute').value;if(!rid)return flash('Route select karo.','err');let d=await sb.from('route_parties').delete().eq('route_id',Number(rid));if(d.error)return flash(d.error.message,'err');const ids=[...document.querySelectorAll('.assignParty:checked')].map(x=>Number(x.value));if(ids.length){const r=await sb.from('route_parties').insert(ids.map(party_id=>({route_id:Number(rid),party_id})));if(r.error)return flash(r.error.message,'err')}await loadBase();flash('Route assignment saved.','ok');managePage()}
async function addParty(){const name=document.getElementById('pname').value.trim();if(!name)return flash('Party name dalo.','err');const r=await sb.from('parties').insert({name,phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim()}).select('id').single();if(r.error)return flash(r.error.message,'err');const selected=[...document.getElementById('proutes').selectedOptions].map(o=>Number(o.value));if(selected.length){const a=await sb.from('route_parties').insert(selected.map(route_id=>({route_id,party_id:r.data.id})));if(a.error)return flash('Party add ho gayi, route assignment fail: '+a.error.message,'err')}await loadBase();flash('Party added'+(selected.length?' + route(s) assigned.':'.'),'ok');managePage()}
async function addRoute(){const name=document.getElementById('rname').value.trim();if(!name)return flash('Route name dalo.','err');const r=await sb.from('routes').insert({name});if(r.error)return flash(r.error.message,'err');await loadBase();flash('Route added.','ok');managePage()}
document.addEventListener('change',e=>{if(e.target.id==='assignRoute')showAssignList()});sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT')location.reload()});start();
</script></body></html>
