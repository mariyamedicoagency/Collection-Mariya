<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1769aa">
<title>Mariya Medico Agency</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f4f6f8;color:#17202a}
header{background:#1769aa;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}header b{font-size:19px}header small{opacity:.9}
.nav{display:flex;gap:7px;overflow:auto;margin-top:10px}.nav button{background:#ffffff22;color:#fff;border:1px solid #ffffff44;padding:8px 11px;border-radius:9px;white-space:nowrap}
.wrap{max-width:1100px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card,.box{background:#fff;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0000000d;margin-bottom:12px}
.big{font-size:25px;font-weight:750;margin-top:5px}.muted{color:#667085}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
input,select,button{font:inherit}input,select{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:9px;background:#fff}
button{padding:11px 14px;border:0;border-radius:9px;background:#1769aa;color:#fff;cursor:pointer}.secondary{background:#eef4f8;color:#1769aa}.danger{background:#b42318}.success{background:#087443}
.msg{padding:11px;border-radius:9px;background:#fff4cc;margin-bottom:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.tablewrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4f8;font-size:12px}
.login{max-width:430px;margin:55px auto}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#1769aa;color:white}.tabs button:not(.active){background:#eef4f8;color:#1769aa}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{padding:25px;text-align:center;color:#667085}
.party-row{display:grid;grid-template-columns:minmax(150px,1.5fr) minmax(110px,1fr) minmax(110px,1fr);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #edf0f2}
.party-row input{padding:9px}.summary{background:#eef7fc;border-radius:12px;padding:13px}.final{font-size:28px;font-weight:800}
@media(max-width:600px){th,td{white-space:nowrap}.tablewrap{margin:0 -5px}.party-row{grid-template-columns:1fr 1fr 1fr}.party-row .pname{grid-column:1/-1;font-weight:650}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card login"><h1>Mariya Medico Agency</h1><p class="muted">Collection & Ledger</p><div id="loginMsg"></div>
<input id="email" type="email" placeholder="Email" autocomplete="username"><br><br>
<input id="password" type="password" placeholder="Password" autocomplete="current-password"><br><br>
<button style="width:100%" onclick="login()">Login</button></div></div>

<div id="appView" class="hidden"><header><b>Mariya Medico Agency</b><br><small id="userLabel"></small>
<div class="nav">
<button onclick="showPage('dashboard')">Dashboard</button><button onclick="showPage('add')">+ Collection</button>
<button onclick="showPage('ledger')">Ledger</button><button onclick="showPage('reports')">Reports</button>
<button onclick="showPage('expenses')">Expenses</button><button id="manageNav" class="hidden" onclick="showPage('manage')">Manage</button>
<button onclick="logout()">Logout</button></div></header>
<main class="wrap"><div id="msg"></div>
<section id="dashboard" class="page"></section><section id="add" class="page hidden"></section>
<section id="ledger" class="page hidden"></section><section id="reports" class="page hidden"></section>
<section id="expenses" class="page hidden"></section><section id="manage" class="page hidden"></section>
</main></div>

<script>
const SUPABASE_URL='https://dwipacrbrmgszyaxgqqw.supabase.co';
const SUPABASE_KEY='sb_publishable_FAd6tW9a9WqIGJ0duNWZyw_DIbFlaDW';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,profile=null,parties=[],routes=[],workers=[],routeParties=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
function flash(t){document.getElementById('msg').innerHTML='<div class="msg">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('msg').innerHTML='',3500)}
function loginMsg(t){document.getElementById('loginMsg').innerHTML='<div class="msg">'+esc(t)+'</div>'}

async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
if(!email||!password)return loginMsg('Email and password required.');const {error}=await sb.auth.signInWithPassword({email,password});
if(error)return loginMsg(error.message);await start()}
async function logout(){await sb.auth.signOut();location.reload()}

async function start(){
const {data:{user}}=await sb.auth.getUser();if(!user){document.getElementById('loginView').classList.remove('hidden');document.getElementById('appView').classList.add('hidden');return}
me=user;let {data:p,error}=await sb.rpc('get_my_profile');
if(error||!p){console.error(error);await sb.auth.signOut();return loginMsg(error?.message||'Profile not found. Ask admin to create the profile for this user.')}
profile=p;document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');
document.getElementById('userLabel').textContent=`${p.name} • ${p.role}`;document.getElementById('manageNav').classList.toggle('hidden',p.role!=='admin');
await loadBase();showPage('dashboard')
}

async function loadBase(){
let a=await sb.from('parties').select('*').order('name');parties=a.data||[];
let r=await sb.from('routes').select('*').eq('active',true).order('name');routes=r.data||[];
let rp=await sb.from('route_parties').select('route_id,party_id');routeParties=rp.data||[];
if(profile?.role==='admin'){let w=await sb.from('profiles').select('*').eq('role','worker').eq('active',true).order('name');workers=w.data||[]}
}

function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');
if(id==='dashboard')dashboard();if(id==='add')addPage();if(id==='ledger')ledgerPage();if(id==='reports')reportsPage();if(id==='expenses')expensesPage();if(id==='manage')managePage()}

async function payments(filters={}){
let q=sb.from('payments').select('id,amount,pay_date,remark,party_id,route_id,worker_id,created_at,payment_mode,parties(name),routes(name),profiles(name)');
if(filters.start)q=q.gte('pay_date',filters.start);if(filters.end)q=q.lte('pay_date',filters.end);if(filters.date)q=q.eq('pay_date',filters.date);
if(filters.route)q=q.eq('route_id',filters.route);if(filters.worker)q=q.eq('worker_id',filters.worker);if(filters.party)q=q.eq('party_id',filters.party);
q=q.order('pay_date',{ascending:false}).order('id',{ascending:false});let {data,error}=await q;return {data:data||[],error}
}
async function expenses(filters={}){
let q=sb.from('expenses').select('id,amount,expense_date,category,route_id,worker_id,remark,routes(name),profiles(name)');
if(filters.start)q=q.gte('expense_date',filters.start);if(filters.end)q=q.lte('expense_date',filters.end);if(filters.date)q=q.eq('expense_date',filters.date);
q=q.order('expense_date',{ascending:false}).order('id',{ascending:false});let {data,error}=await q;return {data:data||[],error}
}

async function dashboard(){
const d=today();let {data,error}=await payments({date:d});if(error)return flash(error.message);
let ex=await expenses({date:d});if(ex.error)return flash(ex.error.message);
let cash=data.filter(x=>(x.payment_mode||'cash')==='cash').reduce((a,x)=>a+Number(x.amount),0);
let account=data.filter(x=>x.payment_mode==='account').reduce((a,x)=>a+Number(x.amount),0);
let expenseTotal=ex.data.reduce((a,x)=>a+Number(x.amount),0),gross=cash+account,finalCash=cash-expenseTotal,byRoute={};
routes.forEach(r=>byRoute[r.id]=0);data.forEach(x=>byRoute[x.route_id]=(byRoute[x.route_id]||0)+Number(x.amount));
document.getElementById('dashboard').innerHTML=`<h2>Dashboard</h2><p class="muted">${d}</p>
<div class="grid"><div class="card">Total Collection<div class="big">${money(gross)}</div></div>
<div class="card">Account<div class="big">${money(account)}</div></div><div class="card">Cash Collection<div class="big">${money(cash)}</div></div>
<div class="card">Expenses<div class="big">${money(expenseTotal)}</div></div><div class="card">Final Cash<div class="big">${money(finalCash)}</div></div></div>
<h3>Route-wise Collection Today</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(byRoute[r.id])}</div></div>`).join('')}</div>
<div class="box"><button onclick="showPage('add')">+ Add Daily Collection</button> <button onclick="showPage('expenses')" class="secondary">+ Add Expense</button> <button class="secondary" onclick="showPage('ledger')">Open Ledger</button></div>`
}

function addPage(){
document.getElementById('add').innerHTML=`<div class="box"><h2>Daily Collection</h2>
<div class="row"><div><label>Date</label><input id="batchDate" type="date" value="${today()}"></div>
<div><label>Route</label><select id="batchRoute" onchange="loadRouteParties()"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>
${profile.role==='admin'?`<div><label>Collected by</label><select id="batchWorker"><option value="${me.id}">${esc(profile.name)} (Admin)</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>`:''}</div>
<br><div id="routePartyBox" class="empty">Pehle Route select karein. Us route ki assigned parties yahan automatically aa jayengi.</div></div>`
}

async function loadRouteParties(){
const rid=document.getElementById('batchRoute').value;const box=document.getElementById('routePartyBox');
if(!rid){box.innerHTML='<div class="empty">Pehle Route select karein.</div>';return}
const ids=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>x.party_id);
const ps=parties.filter(p=>ids.includes(p.id));
if(!ps.length){box.innerHTML='<div class="msg">Is route par abhi koi party assigned nahi hai. Manage → Routes mein party assign karein.</div>';return}
box.innerHTML=`<div class="section-title"><h3>${esc(routes.find(r=>String(r.id)===String(rid))?.name||'Route')}</h3><span class="pill">${ps.length} parties</span></div>
<div class="party-row"><b class="pname">Party</b><b>Cash ₹</b><b>Account ₹</b></div>
${ps.map(p=>`<div class="party-row"><div class="pname">${esc(p.name)}</div><input class="cashInput" data-party="${p.id}" type="number" min="0" step="0.01" placeholder="0"><input class="accountInput" data-party="${p.id}" type="number" min="0" step="0.01" placeholder="0"></div>`).join('')}
<br><div class="summary"><div class="row"><div>Cash: <b id="batchCash">₹0.00</b></div><div>Account: <b id="batchAccount">₹0.00</b></div><div>Total: <b id="batchTotal">₹0.00</b></div></div></div><br>
<div class="section-title"><h3>Expenses</h3><span class="muted">Neeche ke expenses cash se minus honge</span></div>
<div id="batchExpenses">
<div class="row expense-line"><select class="batchExpCat"><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select><input class="batchExpAmt" type="number" min="0" step="0.01" placeholder="Amount"><button type="button" class="danger" onclick="this.parentElement.remove();updateBatchTotals()">Remove</button></div>
</div><br><button type="button" class="secondary" onclick="addExpenseLine()">+ Add Expense</button>
<div class="summary" style="margin-top:12px"><b>Final Cash</b><div class="final" id="batchFinal">₹0.00</div></div><br>
<button type="button" onclick="saveDailyCollection()">Save Daily Collection</button>`;
document.querySelectorAll('.cashInput,.accountInput,.batchExpAmt').forEach(x=>x.addEventListener('input',updateBatchTotals));updateBatchTotals()
}
function addExpenseLine(){document.getElementById('batchExpenses').insertAdjacentHTML('beforeend',`<div class="row expense-line" style="margin-top:8px"><select class="batchExpCat"><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select><input class="batchExpAmt" type="number" min="0" step="0.01" placeholder="Amount"><button type="button" class="danger" onclick="this.parentElement.remove();updateBatchTotals()">Remove</button></div>`);document.querySelectorAll('.batchExpAmt').forEach(x=>x.oninput=updateBatchTotals)}
function updateBatchTotals(){
let cash=[...document.querySelectorAll('.cashInput')].reduce((a,x)=>a+Number(x.value||0),0);
let account=[...document.querySelectorAll('.accountInput')].reduce((a,x)=>a+Number(x.value||0),0);
let ex=[...document.querySelectorAll('.batchExpAmt')].reduce((a,x)=>a+Number(x.value||0),0);
if(document.getElementById('batchCash'))document.getElementById('batchCash').textContent=money(cash);
if(document.getElementById('batchAccount'))document.getElementById('batchAccount').textContent=money(account);
if(document.getElementById('batchTotal'))document.getElementById('batchTotal').textContent=money(cash+account);
if(document.getElementById('batchFinal'))document.getElementById('batchFinal').textContent=money(cash-ex)
}
async function saveDailyCollection(){
const rid=document.getElementById('batchRoute').value;if(!rid)return flash('Route select karein.');
const date=document.getElementById('batchDate').value;const worker=profile.role==='admin'?document.getElementById('batchWorker').value:me.id;
let rows=[];document.querySelectorAll('.cashInput').forEach(i=>{let n=Number(i.value||0);if(n>0)rows.push({party_id:Number(i.dataset.party),amount:n,pay_date:date,route_id:Number(rid),worker_id:worker,payment_mode:'cash',remark:''})});
document.querySelectorAll('.accountInput').forEach(i=>{let n=Number(i.value||0);if(n>0)rows.push({party_id:Number(i.dataset.party),amount:n,pay_date:date,route_id:Number(rid),worker_id:worker,payment_mode:'account',remark:'Account payment'})});
if(!rows.length)return flash('Kam se kam ek party ka payment enter karein.');
let {error}=await sb.from('payments').insert(rows);if(error)return flash(error.message);
let expRows=[...document.querySelectorAll('.expense-line')].map(x=>({category:x.querySelector('.batchExpCat').value,amount:Number(x.querySelector('.batchExpAmt').value||0)})).filter(x=>x.amount>0)
.map(x=>({...x,expense_date:date,route_id:Number(rid),worker_id:worker,remark:'Daily collection expense'}));
if(expRows.length){let er=await sb.from('expenses').insert(expRows);if(er.error)return flash('Collection saved, but expense save failed: '+er.error.message)}
flash('Daily collection saved successfully.');showPage('dashboard')
}

async function ledgerPage(){document.getElementById('ledger').innerHTML=`<div class="box"><h2>Party Ledger</h2><div class="row">
<div><label>Party</label><select id="lparty"><option value="">All parties</option>${parties.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
<div><label>Date</label><input id="ldate" type="date"></div><div><label>Route</label><select id="lroute"><option value="">All routes</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div>
<div><label>Worker</label><select id="lworker"><option value="">All workers</option>${workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div></div><br><button onclick="runLedger()">Search</button></div>
<div id="ledgerResults" class="box"><div class="empty">Choose filters and tap Search.</div></div>`}
async function runLedger(){let f={date:document.getElementById('ldate').value,party:document.getElementById('lparty').value,route:document.getElementById('lroute').value,worker:document.getElementById('lworker').value};Object.keys(f).forEach(k=>{if(!f[k])delete f[k]});
let {data,error}=await payments(f);if(error)return flash(error.message);let cash=data.filter(x=>(x.payment_mode||'cash')==='cash').reduce((a,x)=>a+Number(x.amount),0),account=data.filter(x=>x.payment_mode==='account').reduce((a,x)=>a+Number(x.amount),0);
document.getElementById('ledgerResults').innerHTML=`<div class="grid"><div class="card">Cash<div class="big">${money(cash)}</div></div><div class="card">Account<div class="big">${money(account)}</div></div><div class="card">Total<div class="big">${money(cash+account)}</div></div></div>
<div class="tablewrap"><table><tr><th>Date</th><th>Party</th><th>Cash/Account</th><th>Amount</th><th>Route</th><th>Collected by</th></tr>${data.map(x=>`<tr><td>${esc(x.pay_date)}</td><td>${esc(x.parties?.name)}</td><td>${esc((x.payment_mode||'cash').toUpperCase())}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name)}</td><td>${esc(x.profiles?.name)}</td></tr>`).join('')}</table></div>`}

async function reportsPage(){document.getElementById('reports').innerHTML=`<div class="box"><h2>Reports</h2><div class="row"><div><label>From</label><input id="rstart" type="date" value="${today()}"></div><div><label>To</label><input id="rend" type="date" value="${today()}"></div></div><br><button onclick="runReports()">Generate Report</button></div><div id="reportResults"></div>`;runReports()}
async function runReports(){let start=document.getElementById('rstart').value,end=document.getElementById('rend').value;
let [{data,error},{data:ex,error:exError}]=await Promise.all([payments({start,end}),expenses({start,end})]);if(error)return flash(error.message);if(exError)return flash(exError.message);
let cash=data.filter(x=>(x.payment_mode||'cash')==='cash').reduce((a,x)=>a+Number(x.amount),0),account=data.filter(x=>x.payment_mode==='account').reduce((a,x)=>a+Number(x.amount),0),expenseTotal=ex.reduce((a,x)=>a+Number(x.amount),0),rt={},et={};
data.forEach(x=>{rt[x.route_id]=(rt[x.route_id]||0)+Number(x.amount)});ex.forEach(x=>{et[x.category]=(et[x.category]||0)+Number(x.amount)});
document.getElementById('reportResults').innerHTML=`<div class="grid"><div class="card">Total Collection<div class="big">${money(cash+account)}</div></div><div class="card">Cash<div class="big">${money(cash)}</div></div><div class="card">Account<div class="big">${money(account)}</div></div><div class="card">Expenses<div class="big">${money(expenseTotal)}</div></div><div class="card">Final Cash<div class="big">${money(cash-expenseTotal)}</div></div></div>
<h3>Route-wise Collection</h3><div class="grid">${routes.map(r=>`<div class="card">${esc(r.name)}<div class="big">${money(rt[r.id])}</div></div>`).join('')}</div>
<div class="box"><h3>Expense-wise</h3><div class="tablewrap"><table><tr><th>Expense Type</th><th>Total</th></tr>${Object.keys(et).map(k=>`<tr><td>${esc(k)}</td><td>${money(et[k])}</td></tr>`).join('')}</table></div></div>`}

function expensesPage(){document.getElementById('expenses').innerHTML=`<div class="box"><h2>Expenses</h2><form onsubmit="saveExpense(event)"><div class="row"><div><label>Date</label><input id="edate" type="date" value="${today()}" required></div>
<div><label>Expense Type</label><select id="ecategory" required><option value="">Select type</option><option>Daily Boys</option><option>Fooding Boys</option><option>Petrol</option><option>Transport</option><option>Other</option></select></div>
<div><label>Amount</label><input id="eamount" type="number" min="0.01" step="0.01" required></div><div><label>Route</label><select id="eroute"><option value="">Common / No specific route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div></div><br>
<div class="row"><div><label>Paid/Added by</label><select id="eworker"><option value="${me.id}">${esc(profile.name)} (${esc(profile.role)})</option>${profile.role==='admin'?workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join(''):''}</select></div><div><label>Remark</label><input id="eremark" placeholder="Optional"></div></div><br><button>Save Expense</button></form></div>
<div class="box"><div class="section-title"><h3>Expense History</h3><button class="secondary" onclick="loadExpenseHistory()">Refresh</button></div><div id="expenseHistory" class="empty">Loading...</div></div>`;loadExpenseHistory()}
async function saveExpense(e){e.preventDefault();const route=document.getElementById('eroute').value,worker=document.getElementById('eworker').value;
const row={amount:Number(document.getElementById('eamount').value),expense_date:document.getElementById('edate').value,category:document.getElementById('ecategory').value,route_id:route?Number(route):null,worker_id:worker,remark:document.getElementById('eremark').value.trim()};
let {error}=await sb.from('expenses').insert(row);if(error)return flash(error.message);flash('Expense saved successfully.');e.target.reset();document.getElementById('edate').value=today();await loadExpenseHistory();dashboard()}
async function loadExpenseHistory(){let {data,error}=await expenses({});if(error)return document.getElementById('expenseHistory').innerHTML='<div class="msg">'+esc(error.message)+'</div>';
let total=data.reduce((a,x)=>a+Number(x.amount),0);document.getElementById('expenseHistory').innerHTML=`<p><b>Total: ${money(total)}</b></p><div class="tablewrap"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Route</th><th>Added by</th><th>Remark</th></tr>${data.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.routes?.name||'Common')}</td><td>${esc(x.profiles?.name||'')}</td><td>${esc(x.remark||'')}</td></tr>`).join('')}</table></div>`}

function managePage(){document.getElementById('manage').innerHTML=`<div class="tabs"><button class="active" onclick="manageTab('partyTab',this)">Parties</button><button onclick="manageTab('routeTab',this)">Routes & Party Assignment</button></div>
<div id="partyTab"><div class="box"><h2>Add Party</h2><div class="row"><input id="pname" placeholder="Party name"><input id="pphone" placeholder="Phone"><input id="paddress" placeholder="Address"><button onclick="addParty()">Add Party</button></div></div>
<div class="box"><h3>Parties</h3>${parties.map(p=>`<p><b>${esc(p.name)}</b> <span class="pill">${esc(p.phone||'')}</span><br><span class="muted">${esc(p.address||'')}</span></p>`).join('')}</div></div>
<div id="routeTab" class="hidden"><div class="box"><h2>Add Route</h2><div class="row"><input id="rname" placeholder="Route name"><button onclick="addRoute()">Add Route</button></div></div>
<div class="box"><h3>Assign Parties to Route</h3><div class="row"><select id="assignRoute"><option value="">Select route</option>${routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button onclick="assignAllParties()">Save Selected Parties</button></div>
<div id="assignList" class="empty">Route select karein.</div></div><div class="box"><h3>Routes</h3>${routes.map(r=>`<p><b>${esc(r.name)}</b> — ${routeParties.filter(x=>String(x.route_id)===String(r.id)).length} parties assigned</p>`).join('')}</div></div>`;
document.getElementById('assignRoute').onchange=showAssignList}
function showAssignList(){const rid=document.getElementById('assignRoute').value,box=document.getElementById('assignList');if(!rid){box.innerHTML='Route select karein.';return}
const assigned=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>String(x.party_id));box.innerHTML=parties.map(p=>`<label style="display:block;padding:7px;border-bottom:1px solid #eee"><input class="assignParty" type="checkbox" value="${p.id}" ${assigned.includes(String(p.id))?'checked':''}> ${esc(p.name)}</label>`).join('')||'No parties'}
async function assignAllParties(){const rid=document.getElementById('assignRoute').value;if(!rid)return flash('Route select karein.');
let old=routeParties.filter(x=>String(x.route_id)===String(rid)).map(x=>x.party_id);if(old.length){let d=await sb.from('route_parties').delete().eq('route_id',Number(rid));if(d.error)return flash(d.error.message)}
let ids=[...document.querySelectorAll('.assignParty:checked')].map(x=>Number(x.value));if(ids.length){let {error}=await sb.from('route_parties').insert(ids.map(pid=>({route_id:Number(rid),party_id:pid})));if(error)return flash(error.message)}
flash('Route parties updated.');await loadBase();managePage()}
function manageTab(id,btn){document.querySelectorAll('#manage>div[id$="Tab"]').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='routeTab')showAssignList()}
async function addParty(){let name=document.getElementById('pname').value.trim();if(!name)return;let {error}=await sb.from('parties').insert({name,phone:document.getElementById('pphone').value.trim(),address:document.getElementById('paddress').value.trim()});if(error)return flash(error.message);flash('Party added.');await loadBase();managePage()}
async function addRoute(){let name=document.getElementById('rname').value.trim();if(!name)return;let {error}=await sb.from('routes').insert({name});if(error)return flash(error.message);flash('Route added.');await loadBase();managePage()}
sb.auth.onAuthStateChange((_event)=>{if(_event==='SIGNED_OUT')location.reload()});start();
</script>
</body></html>
